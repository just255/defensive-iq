<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defensive IQ — Field the Play</title>
</head>
<body>
<style>
  :root {
    color-scheme: dark;
    --sky: #0b1120;
    --sky-2: #0e1730;
    --panel: #0f1a30;
    --panel-2: #14233f;
    --line-soft: rgba(255,255,255,.08);
    --ink: #eaf1fb;
    --muted: #93a6c4;
    --muted-2: #64789a;
    --turf: #1a4632;
    --turf-2: #23583d;
    --clay: #a86038;
    --clay-2: #7d4526;
    --chalk: #e8eef5;
    --accent: #26c565;   /* turf green — correct / positive */
    --flame: #f97316;    /* your position */
    --gold: #fbbf24;     /* bases, score */
    --wrong: #ef4444;
    --font-display: 'Bahnschrift','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
    --font-body: system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(120% 60% at 50% -8%, rgba(56,110,80,.28), transparent 60%),
      radial-gradient(90% 50% at 50% 0%, rgba(120,160,200,.10), transparent 55%),
      linear-gradient(180deg, var(--sky-2), var(--sky));
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  /* The field fills the whole stage; the HUD floats on top of it. */
  .stage {
    position: relative;
    width: 100%;
    max-width: 520px;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: var(--sky);
  }

  .disp { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
  .num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

  /* ===== Top HUD: scorebug + thin IQ / gear bar, floated on the field ===== */
  .hud-top { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 6; display: flex; flex-direction: column; gap: 6px; }

  /* ---- TV-style scorebug ---- */
  .scorebug { display: flex; align-items: stretch; border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, rgba(18,32,58,.92), rgba(11,21,38,.86)); backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 8px 22px -12px rgba(0,0,0,.8);
    font-family: var(--font-display); }
  .scorebug .seg { display: flex; flex-direction: column; justify-content: center; padding: 4px 10px; border-left: 1px solid rgba(255,255,255,.08); }
  .scorebug .seg:first-child { border-left: 0; }
  .scorebug .teams { padding: 4px 0; }
  .scorebug .tr { display: flex; align-items: center; gap: 7px; padding: 1px 10px; }
  .scorebug .tr .tab { width: 4px; height: 13px; border-radius: 2px; }
  .scorebug .tr.away .tab { background: #6ea8ff; }
  .scorebug .tr.home .tab { background: var(--flame); }
  .scorebug .tr .ab { font-size: 13px; color: var(--ink); min-width: 32px; letter-spacing: .04em; }
  .scorebug .tr .rs { margin-left: auto; font-size: 15px; font-variant-numeric: tabular-nums; color: #fff; min-width: 15px; text-align: right; }
  .scorebug .inn { align-items: center; gap: 2px; }
  .scorebug .inn .il { display: flex; align-items: center; gap: 3px; font-size: 13px; color: var(--ink); }
  .scorebug .inn .il .ar { color: var(--accent); font-size: 11px; }
  .scorebug .dia { width: 26px; height: 18px; }
  .scorebug .bso { gap: 2px; justify-content: center; flex: 1; }
  .scorebug .bsrow { display: flex; align-items: center; gap: 5px; }
  .scorebug .bsrow .bl { font-size: 9px; color: var(--muted-2); width: 8px; }
  .scorebug .bsrow .pips { display: flex; gap: 3px; }
  .scorebug .bsrow .p { width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); }
  .scorebug .bsrow.b .p.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 5px -1px var(--gold); }
  .scorebug .bsrow.s .p.on { background: var(--wrong); border-color: var(--wrong); box-shadow: 0 0 5px -1px var(--wrong); }
  .scorebug .bsrow.o .p.on { background: var(--flame); border-color: var(--flame); box-shadow: 0 0 5px -1px var(--flame); }

  /* ---- thin IQ / streak / gear bar under the scorebug ---- */
  .iqbar { display: flex; align-items: center; gap: 9px; padding: 5px 11px; border-radius: 10px;
    background: linear-gradient(180deg, rgba(10,17,30,.78), rgba(10,17,30,.6)); backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,.08); font-family: var(--font-display); }
  .iqbar .iqcell { display: flex; align-items: baseline; gap: 5px; }
  .iqbar .iqcell b { font-size: 8px; letter-spacing: .14em; color: var(--muted-2); font-weight: 400; }
  .iqbar .iq { font-size: 16px; color: var(--gold); }
  .iqbar .streak { font-size: 13px; color: var(--flame); display: inline-flex; align-items: center; gap: 3px; }
  .iqbar .progress { font-size: 10px; letter-spacing: .06em; color: var(--muted-2); }
  .iqbar .spacer { flex: 1; }
  .iqbar .gearbtn { border: 0; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; padding: 2px 4px; line-height: 1; }
  .iqbar .gearbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== Gear popover: drill-position filter + Quiz/Reference mode ===== */
  .gearmenu { position: absolute; top: 92px; right: 8px; z-index: 8; width: 210px; padding: 11px;
    border-radius: 13px; border: 1px solid var(--line-soft);
    background: linear-gradient(180deg, rgba(16,26,48,.99), rgba(12,20,36,.99)); box-shadow: 0 18px 40px -16px rgba(0,0,0,.9);
    animation: rise .16s ease-out; }
  .gearmenu[hidden] { display: none; }
  .gearmenu .gm-label { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em; font-size: 9px; color: var(--muted-2); margin: 0 0 5px 2px; }
  .gearmenu .gm-label.mt { margin-top: 11px; }
  .modes, .posbar { display: flex; gap: 5px; }
  .modes button, .posbar button {
    flex: 1; border: 1px solid var(--line-soft); cursor: pointer; padding: 7px 0; border-radius: 9px;
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; font-size: 12px;
    background: transparent; color: var(--muted); transition: background .15s, color .15s;
  }
  .modes button[aria-pressed="true"] { background: var(--accent); color: #05210f; border-color: transparent; }
  .posbar button[aria-pressed="true"] { background: var(--flame); color: #1a0e02; border-color: transparent; }
  .modes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .posbar button:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }

  /* ===== Bottom HUD: coaching panel / read bar / feedback, floated on the field ===== */
  .hud-bottom { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 6; }
  .hud-bottom > * { max-height: calc(100dvh - 118px); overflow-y: auto; overscroll-behavior: contain; }
  /* translucent so the field reads through the panels */
  .hud-bottom .prepitch { background: linear-gradient(180deg, rgba(14,22,38,.86), rgba(12,20,35,.96)); backdrop-filter: blur(5px); }
  .hud-bottom .feedback { background: linear-gradient(180deg, rgba(14,22,38,.9), rgba(12,20,35,.97)); backdrop-filter: blur(5px); }

  /* position badge + premise line inside the coaching panel */
  .pretop { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .posbadge { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    color: #1a0e02; background: radial-gradient(circle at 35% 30%, #ffb56b, var(--flame));
    box-shadow: 0 0 16px -4px rgba(249,115,22,.7); font-family: var(--font-display); font-size: 15px; }
  .pretop .callline { margin-bottom: 0; text-align: left; flex: 1; }
  .premise { font-size: 12.5px; color: var(--ink); font-weight: 600; line-height: 1.3; margin-bottom: 10px; text-wrap: balance; }

  /* ---- Field fills the whole stage (cropping a little foul territory) ---- */
  .fieldwrap { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(80% 55% at 50% 10%, rgba(150,190,220,.10), transparent 60%), var(--sky); }
  svg.field { position: absolute; top: 50%; left: 50%; width: auto; height: 98%;
    transform: translate(-50%, -50%); }

  .prompt { text-align: center; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--muted); margin: 12px 0 8px; }

  /* ---- Pre-pitch panel: read the situation before the play ---- */
  .prepitch {
    border: 1px solid var(--line-soft); border-radius: 16px; padding: 14px 15px 15px;
    background: linear-gradient(180deg, rgba(251,191,36,.06), transparent 62%), var(--panel);
  }
  .callline {
    text-align: center; font-family: var(--font-display); text-transform: uppercase;
    letter-spacing: .05em; font-size: 17px; line-height: 1.18; color: var(--gold);
    text-wrap: balance; margin-bottom: 12px;
  }
  .brief { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 11px; }
  .brief li { font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .brief .lab {
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em;
    font-size: 11px; margin-right: 6px; white-space: nowrap;
  }
  .brief .bl-s .lab { color: var(--muted-2); }
  .brief .bl-p .lab { color: var(--gold); }
  .brief .bl-r .lab { color: var(--accent); }
  .brief li b { color: var(--ink); font-weight: 700; }
  .diffrow { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .difflabel { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-2); margin-right: 2px; }
  .diffchip {
    flex: 1; border: 1px solid var(--line-soft); cursor: pointer; padding: 7px; border-radius: 9px;
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; font-size: 12px;
    background: transparent; color: var(--muted); transition: background .15s, color .15s;
  }
  .diffchip[aria-pressed="true"] { background: var(--flame); color: #1a0e02; border-color: transparent; }
  .diffchip:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
  .playbtn {
    width: 100%; border: 0; cursor: pointer; padding: 15px; border-radius: 13px;
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: 18px;
    background: linear-gradient(180deg, #34d374, var(--accent)); color: #05210f;
    box-shadow: 0 12px 26px -12px rgba(38,197,101,.9);
  }
  .playbtn:active { transform: scale(.99); }
  .playbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---- The read: countdown while the ball is live ---- */
  .readui { text-align: center; }
  .readprompt {
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: .09em;
    font-size: 15px; color: var(--flame); margin-bottom: 9px;
  }
  .readbar { height: 9px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
  .readfill { height: 100%; width: 100%; border-radius: 6px; background: var(--accent); }

  /* ---- Feedback ---- */
  .feedback { margin-top: 12px; border-radius: 16px; padding: 14px; border: 1px solid var(--line-soft); background: var(--panel);
    display: none; }
  .feedback.show { display: block; animation: rise .28s ease-out; }
  .feedback .verdict { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .feedback.good .verdict { color: var(--accent); }
  .feedback.bad .verdict { color: var(--wrong); }
  .feedback .result { margin-top: 6px; color: var(--ink); font-size: 15px; line-height: 1.45; }
  .feedback .why { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .feedback .why::before { content: 'Your job — '; color: var(--accent); font-weight: 700; }

  /* glossary — tap a term for a kid-friendly hint */
  .term { color: var(--accent); border-bottom: 1px dashed rgba(38,197,101,.65); cursor: pointer; }
  .term:active { background: rgba(38,197,101,.16); }
  .glosspop { position: fixed; z-index: 100; display: none; max-width: 280px; padding: 11px 13px;
    border-radius: 12px; border: 1px solid rgba(38,197,101,.35); background: #10213b;
    box-shadow: 0 14px 34px -10px rgba(0,0,0,.85); }
  .glosspop .gt { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; font-size: 12px; color: var(--accent); margin-bottom: 3px; }
  .glosspop .gd { font-size: 13px; line-height: 1.45; color: var(--ink); }
  .feedback .next {
    margin-top: 14px; width: 100%; border: 0; cursor: pointer; padding: 14px; border-radius: 12px;
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: 17px;
    background: var(--accent); color: #05210f;
  }
  .feedback .next:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .feedback .fbrow { display: flex; gap: 8px; margin-top: 14px; }
  .feedback .fbrow .next { margin-top: 0; flex: 2; }
  .feedback .replay {
    flex: 1; border: 1px solid var(--line-soft); cursor: pointer; padding: 14px; border-radius: 12px;
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: 15px;
    background: var(--field-700, #1b2742); color: var(--ink);
  }
  .feedback .replay:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Reference panel ---- */
  .refpanel { margin-top: 12px; border-radius: 16px; border: 1px solid var(--line-soft); background: var(--panel); overflow: hidden; }
  .refpanel h3 { margin: 0; padding: 12px 14px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line-soft); }
  .refrow { display: flex; gap: 12px; padding: 10px 14px; font-size: 14px; }
  .refrow + .refrow { border-top: 1px solid rgba(255,255,255,.04); }
  .refrow .rp { flex: 0 0 34px; font-family: var(--font-display); color: var(--flame); }
  .refrow .rj { color: var(--ink); }
  .refrow.you .rj { color: var(--flame); font-weight: 600; }

  .foot { margin-top: 18px; text-align: center; font-size: 11px; color: var(--muted-2); line-height: 1.5; }

  /* dot pulse */
  @keyframes ping { 0% { transform: scale(1); opacity: .8; } 70%,100% { transform: scale(2.1); opacity: 0; } }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dash { to { stroke-dashoffset: 0; } }
  @keyframes shake { 10%,90%{transform:translateX(-1px)} 30%,70%{transform:translateX(2px)} 50%{transform:translateX(-2px)} }
  .shake { animation: shake .35s; }

  @media (prefers-reduced-motion: reduce) {
    .pulse-ring { display: none; }
    .ballpath { stroke-dashoffset: 0 !important; animation: none !important; }
    .feedback.show, .shake { animation: none; }
  }
</style>

<div class="stage">
  <div class="fieldwrap">
    <svg class="field" id="field" viewBox="0 0 100 118" role="img" aria-label="Baseball field">
      <!-- grass -->
      <defs>
        <radialGradient id="grass" cx="50%" cy="18%" r="90%">
          <stop offset="0%" stop-color="#27603f"/>
          <stop offset="60%" stop-color="#1a4632"/>
          <stop offset="100%" stop-color="#12331f"/>
        </radialGradient>
        <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b96c40"/>
          <stop offset="100%" stop-color="#7d4526"/>
        </linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="0.5"/></filter>
      </defs>

      <!-- fair-territory grass (home → foul poles → irregular outfield wall) -->
      <path d="M50 98 L10 58 L15 40 L31 24 L52 19 L72 27 L87 47 L90 58 Z" fill="url(#grass)"/>
      <!-- warning track just inside the wall -->
      <path d="M13 56 L17.5 42 L32.5 27 L52 22 L70.5 29 L84.5 47 L87.5 56" fill="none" stroke="rgba(196,142,86,.30)" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- outfield wall (irregular, like a real ballpark) -->
      <path d="M10 58 L15 40 L31 24 L52 19 L72 27 L87 47 L90 58" fill="none" stroke="#0a1f14" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M10 58 L15 40 L31 24 L52 19 L72 27 L87 47 L90 58" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="0.5" stroke-linejoin="round"/>

      <!-- infield dirt diamond -->
      <polygon points="50,98 77,71 50,44 23,71" fill="url(#clay)"/>
      <!-- infield grass inset -->
      <polygon points="50,90 70,71 50,52 30,71" fill="url(#grass)"/>
      <!-- pitcher's mound -->
      <circle cx="50" cy="71" r="4.6" fill="url(#clay)"/>

      <!-- foul lines -->
      <line x1="50" y1="98" x2="90" y2="58" stroke="#e8eef5" stroke-width="0.6" opacity=".85"/>
      <line x1="50" y1="98" x2="10" y2="58" stroke="#e8eef5" stroke-width="0.6" opacity=".85"/>
      <!-- base-path outline -->
      <polygon points="50,98 77,71 50,44 23,71" fill="none" stroke="#e8eef5" stroke-width="0.4" opacity=".45"/>

      <!-- bases -->
      <g id="bases"></g>
      <!-- ball path -->
      <line id="balltail" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity="0"/>
      <circle id="ball" r="1.4" fill="#fff" style="display:none"/>

      <!-- fielders -->
      <g id="fielders"></g>
      <!-- option targets -->
      <g id="targets"></g>
      <!-- runners -->
      <g id="runners"></g>
      <!-- you marker -->
      <g id="you"></g>
    </svg>
  </div><!-- /.fieldwrap -->

  <div class="hud-top">
    <div class="scorebug" id="scorebug"></div>
    <div class="iqbar">
      <span class="iqcell"><b>DEF IQ</b><span class="iq num" id="iq">0</span></span>
      <span class="streak num" id="streak">0<span style="font-size:11px">🔥</span></span>
      <span class="spacer"></span>
      <span class="progress num" id="progress"></span>
      <button class="gearbtn" id="gearBtn" aria-label="Settings" aria-expanded="false">⚙</button>
    </div>
  </div>

  <div class="gearmenu" id="gearmenu" hidden>
    <div class="gm-label">Drill position</div>
    <div class="posbar" id="posbar" role="tablist" aria-label="Position"></div>
    <div class="gm-label mt">Mode</div>
    <div class="modes" role="tablist" aria-label="Mode">
      <button id="mQuiz" aria-pressed="true">Quiz</button>
      <button id="mRef" aria-pressed="false">Reference</button>
    </div>
  </div>

  <div class="hud-bottom">
    <div id="quizUI">
      <div class="prepitch" id="prepitch">
        <div class="pretop">
          <span class="posbadge" id="posbadge">3B</span>
          <div class="callline" id="callline"></div>
        </div>
        <div class="premise" id="premise"></div>
        <ul class="brief" id="brief"></ul>
        <div class="diffrow">
          <span class="difflabel">Play speed</span>
          <button class="diffchip" id="diffRookie" aria-pressed="true">Rookie</button>
          <button class="diffchip" id="diffReal" aria-pressed="false">Real</button>
        </div>
        <button class="playbtn" id="playbtn">▶&nbsp; Play the ball</button>
      </div>
      <div class="readui" id="readUI" style="display:none">
        <div class="readprompt" id="readprompt">Read it — get to your spot!</div>
        <div class="readbar"><div class="readfill" id="readfill"></div></div>
      </div>
    </div>

    <div class="feedback" id="feedback">
      <div class="verdict" id="verdict"></div>
      <div class="result" id="result"></div>
      <div class="why" id="why"></div>
      <div class="fbrow">
        <button class="replay" id="replay">↻ Replay</button>
        <button class="next" id="next">Next play ▸</button>
      </div>
    </div>

    <div class="refpanel" id="refpanel" style="display:none">
      <h3>Everyone's job on this play</h3>
      <div id="reflist"></div>
    </div>
  </div>
</div><!-- /.stage -->

<script>
(function () {
  // Guarantee a mobile viewport meta in <head>. When this file is published as
  // an artifact it's wrapped in an outer <head>/<body>, which can strip or
  // misplace our literal <meta viewport> into the body where it's ignored —
  // leaving the phone at a wide default layout viewport (everything tiny). Set
  // it from JS so it always takes effect.
  (function ensureViewport() {
    let m = document.querySelector('meta[name="viewport"]');
    if (!m) { m = document.createElement('meta'); m.setAttribute('name', 'viewport'); document.head.appendChild(m); }
    m.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
  })();

  // Fielder home coordinates on the 100x118 field.
  const POS = {
    P:  [50, 71], C: [50, 106], '1B': [72, 66], '2B': [62, 56],
    SS: [38, 56], '3B': [27, 66], LF: [28, 38], CF: [52, 29], RF: [74, 38],
  };
  const BASES = { '1B': [77, 71], '2B': [50, 44], '3B': [23, 71], H: [50, 98] };

  const SCENARIOS = [
    {
      pos: '3B',
      game: { inning: 3, half: 'top', away: 2, home: 3, balls: 1, strikes: 1, outs: 0 },
      sit: 'No outs · Runner on 1st',
      play: 'Batter squares to bunt down the third-base line.',
      ball: [38, 86],
      runners: ['1B'],
      prompt: 'What’s your job?',
      options: [
        { n: 1, label: 'Charge & field it', spot: [40, 87], correct: true },
        { n: 2, label: 'Hold and cover 3rd', spot: [23, 71] },
        { n: 3, label: 'Back up second', spot: [50, 44] },
      ],
      why: 'On a bunt you attack the ball — get it and throw to first. The shortstop rotates behind you to cover third.',

  // Unlabeled candidate spots — Rylan has to KNOW where to go, not read a label.
  // They only become tappable once the ball is live (phase === 'live').
  function drawTargets(sc) {
    const tg = $('targets'); tg.innerHTML = '';
    if (mode !== 'quiz') return;
    displayOpts.forEach((o) => {
      const [x, y] = o.spot;
      const g = el('g', { class: 'target', tabindex: '0', role: 'button', 'aria-label': 'Fielding spot', style: 'cursor:pointer' });
      g.dataset.d = o._d; g.setAttribute('id', 'tgt-' + o._d);
      if (!reduced) {
        const ping = el('circle', { cx: x, cy: y, r: 3.6, fill: 'none', stroke: '#26c565', 'stroke-width': .8 });
        ping.style.transformOrigin = `${x}px ${y}px`;
        ping.style.animation = `ping 1.7s ease-out ${o._d * .22}s infinite`;
        g.appendChild(ping);
      }
      g.appendChild(el('circle', { class: 'tdisc', cx: x, cy: y, r: 3.4, fill: 'rgba(9,20,14,.55)', stroke: '#26c565', 'stroke-width': 1 }));
      g.appendChild(el('circle', { cx: x, cy: y, r: 6.5, fill: 'transparent' })); // fat tap target for phones
      g.addEventListener('click', () => selectSpot(o));
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSpot(o); } });
      tg.appendChild(g);
    });
  }

  // Highlight the spot Rylan committed to; dim the pulse on the rest.
  function markSelected(o) {
    document.querySelectorAll('#targets .target').forEach((g) => {
      const disc = g.querySelector('.tdisc');
      const ring = g.querySelector('circle:not(.tdisc)');
      const on = Number(g.dataset.d) === o._d;
      if (disc) { disc.setAttribute('fill', on ? 'rgba(249,115,22,.9)' : 'rgba(9,20,14,.4)'); disc.setAttribute('stroke', on ? '#f97316' : 'rgba(38,197,101,.35)'); }
      if (ring && ring.style) ring.style.animation = 'none';
    });
  }

  let lastPlay = null;

  // ---- the read loop: Play → ball in flight (the clock) → commit → resolve ----

  // The read window = how long the ball is in the air to where it's fielded.
  // Rookie stretches it (slower ball, lots of reading time), Real tightens it
  // toward game speed. Longer balls give a little more time than short ones.
  function flightDur(dist) {
    return Math.min(3000, Math.max(1500, dist / 32 * 1000)) * readScale;
  }
  function setReadFill(frac) {
    const rf = $('readfill'); if (!rf) return;
    rf.style.width = Math.max(0, frac * 100) + '%';
    rf.style.background = frac > 0.5 ? 'var(--accent)' : frac > 0.25 ? 'var(--gold)' : 'var(--wrong)';
  }

  function buildPrepitch(sc) {
    const c = sc.coach;
    $('callline').innerHTML = linkify(c.call);
    $('brief').innerHTML =
      `<li class="bl-s"><span class="lab">Situation</span>${linkify(c.situation)}</li>` +
      `<li class="bl-p"><span class="lab">Priority</span>${linkify(c.priority)}</li>` +
      `<li class="bl-r"><span class="lab">Your read</span>${linkify(c.read)}</li>`;
  }

  // PLAY pressed — put the ball in motion. Its flight to the fielded spot is the
  // window: tap a spot before it's fielded, or you froze.
  function startPlay() {
    if (phase !== 'setup' || mode !== 'quiz') return;
    const sc = order[idx];
    phase = 'live'; pick = null; answered = false;
    $('prepitch').style.display = 'none';
    $('readUI').style.display = '';
    $('readprompt').textContent = 'Read it — get to your spot!';
    setReadFill(1);
    drawTargets(sc);

    const ball = $('ball');
    ball.style.display = 'block';
    ball.setAttribute('r', ballRadius(sc.hitType));
    resetActor(ball, HITSTART);

    if (reduced) { resetActor(ball, sc.ball); return; } // no clock — just wait for a tap
    animateFlight(sc, () => endRead());
  }

  // Rylan taps a spot during the read. His fielder reacts immediately, but the
  // play doesn't resolve until the ball is actually fielded (flight ends).
  function selectSpot(o) {
    if (phase !== 'live') return;
    pick = o;
    moveYou(o.spot);
    markSelected(o);
    if (reduced) { endRead(); return; }     // no clock in reduced motion — commit now
    $('readprompt').textContent = 'Locked — here it comes!';
  }

  function endRead() {
    if (phase !== 'live') return;
    phase = 'resolved';
    $('readUI').style.display = 'none';
    commit(pick);
  }

  // Flight of the batted ball from the bat to where it's fielded. rAF tween with
  // a motion tail; a fly ball swells toward its peak. Also drives the countdown.
  // A cancel token stops a stale flight if the play changes mid-air.
  function animateFlight(sc, done) {
    const ball = $('ball'), tail = $('balltail');
    const [ax, ay] = HITSTART, [bx, by] = sc.ball;
    const baseR = ballRadius(sc.hitType), dist = Math.hypot(bx - ax, by - ay);
    const dur = flightDur(dist), dd = dist || 1, t0 = performance.now();
    const my = ++flightToken;
    (function step(t) {
      if (my !== flightToken) return;                 // superseded — abandon quietly
      const f = Math.min(1, (t - t0) / dur);
      const cx = ax + (bx - ax) * f, cy = ay + (by - ay) * f;
      const r = sc.hitType === 'fly' ? baseR * (1 + 0.6 * Math.sin(Math.PI * f)) : baseR;
      ball.setAttribute('r', r); ball.setAttribute('cx', cx); ball.setAttribute('cy', cy);
      const behind = Math.min(8, f * dist);
      tail.setAttribute('x1', cx - (bx - ax) / dd * behind); tail.setAttribute('y1', cy - (by - ay) / dd * behind);
      tail.setAttribute('x2', cx); tail.setAttribute('y2', cy);
      tail.setAttribute('stroke-width', Math.max(1, r * 0.9)); tail.setAttribute('opacity', 0.6);
      setReadFill(1 - f);
      if (f < 1) requestAnimationFrame(step);
      else { tail.setAttribute('opacity', 0); setReadFill(0); done(); }
    })(t0);
  }

  // Commit the read: score it, then play out the consequence. picked === null
  // means he froze — we demo the correct play so he sees what he missed.
  function commit(picked) {
    const sc = order[idx];
    const correct = displayOpts.find((o) => o.correct);
    const frozen = !picked;
    const good = !frozen && !!picked.correct;
    const outcome = frozen ? sc.resolve[correct.n] : sc.resolve[picked.n];

    if (good) { streak += 1; iq += 10 + Math.min(streak, 5) * 2; }
    else { streak = 0; iq = Math.max(0, iq - 4); }
    animateNum($('iq'), iq);
    $('streak').innerHTML = `${streak}<span style="font-size:16px">🔥</span>`;

    lastPlay = { sc, picked, correct, good, frozen, outcome, youSpot: frozen ? correct.spot : picked.spot };
    unfold(false);
  }

  // ---- baserunning: run along the base paths (rounding bases) ----
  const RUN = ['H', '1B', '2B', '3B'];
  const runnerPoint = (k) => (k === 'H' ? [50, 95] : [BASES[k][0], BASES[k][1] - 3.2]);
  function pathBetween(from, to) {
    const iFrom = RUN.indexOf(from);
    const iTo = to === 'H' ? 4 : RUN.indexOf(to);
    const keys = [];
    for (let i = iFrom; i <= iTo; i++) keys.push(i === 4 ? 'H' : RUN[i]);
    return keys;
  }
  function runBases(elm, from, to, dur) {
    if (!elm || !to) return;
    const pts = pathBetween(from, to).map(runnerPoint);
    elm.style.transition = 'none';
    if (reduced || pts.length < 2) { const p = pts[pts.length - 1]; elm.setAttribute('cx', p[0]); elm.setAttribute('cy', p[1]); return; }
    const segs = []; let total = 0;
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); total += d; }
    const t0 = performance.now();
    (function step(t) {
      const p = Math.min(1, (t - t0) / dur); let dist = p * total, i = 0;
      while (i < segs.length - 1 && dist > segs[i]) { dist -= segs[i]; i++; }
      const a = pts[i], b = pts[i + 1] || pts[i], f = segs[i] ? Math.min(1, dist / segs[i]) : 1;
      elm.setAttribute('cx', a[0] + (b[0] - a[0]) * f); elm.setAttribute('cy', a[1] + (b[1] - a[1]) * f);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function resetActor(el, pt) { if (!el || !pt) return; el.style.transition = 'none'; el.setAttribute('cx', pt[0]); el.setAttribute('cy', pt[1]); el.getBoundingClientRect(); }
  function resetFielder(key) {
    const c = $('fc-' + key), t = $('ft-' + key), [x, y] = POS[key];
    if (c) { c.style.transition = 'none'; c.setAttribute('cx', x); c.setAttribute('cy', y); c.getBoundingClientRect(); }
    if (t) { t.style.transition = 'none'; t.setAttribute('x', x); t.setAttribute('y', y + 0.9); }
  }
  function resetYou(pos) {
    const d = $('youdot'), t = $('youlabel'), [x, y] = pos;
    if (d) { d.style.transition = 'none'; d.setAttribute('cx', x); d.setAttribute('cy', y); d.getBoundingClientRect(); d.style.transition = 'cx .6s ease, cy .6s ease'; }
    if (t) { t.style.transition = 'none'; t.setAttribute('x', x); t.setAttribute('y', y + 0.9); t.style.transition = 'x .6s ease, y .6s ease'; }
  }

  // Plays out (or replays) the stored play: fielders react, you move, the ball
  // travels, runners round the bases, and the batter runs it out.
  function unfold(isReplay) {
    if (!lastPlay) return;
    const { sc, picked, correct, good, frozen, outcome, youSpot } = lastPlay;
    $('targets').innerHTML = '';
    const pr = document.querySelector('.pulse-ring'); if (pr) pr.remove();

    // reset the supporting actors to their pre-play spots
    if (sc.runners && sc.runners[0]) resetActor($('leadrunner'), runnerPoint(sc.runners[0]));
    resetActor($('batter'), runnerPoint('H'));
    (sc.movers || []).forEach(([k]) => resetFielder(k));

    // The throw sequence + baserunning + feedback — runs once the ball's fielded.
    const runResolve = () => {
      const beat = reduced ? 0 : 420;   // fielder secures & sets before the throw
      requestAnimationFrame(() => {
        (sc.movers || []).forEach(([k, to]) => moveFielder(k, to, 1900));
        if (frozen) moveYou(youSpot);   // demo the spot he never got to
        if (!good) { $('field').classList.add('shake'); setTimeout(() => $('field').classList.remove('shake'), 380); }
        setTimeout(() => {
          if (sc.runners && sc.runners[0]) runBases($('leadrunner'), sc.runners[0], outcome.runnerTo, 2000);
          runBases($('batter'), 'H', outcome.batterTo || '1B', 1650);
          animateResolution(outcome, () => {
            if (!good && !frozen) moveYou(correct.spot); // wrong tap → show where he should've been
            if (!isReplay) {
              const fb = $('feedback');
              fb.className = 'feedback show ' + (good ? 'good' : 'bad');
              $('verdict').innerHTML = good ? '✓ Right — and in time!' : (frozen ? '✕ Too slow — you froze' : '✕ Wrong spot — here’s why');
              $('result').innerHTML = frozen
                ? linkify('You never got to your spot. Your job was to ' + correct.label.toLowerCase() + '. Here’s the play you missed:')
                : linkify(outcome.verdict);
              $('why').innerHTML = linkify(sc.why);
              fb.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
            }
          });
        }, beat);
      });
    };

    if (isReplay) {
      // Replay the whole rep from the hit: Rylan back home, ball back at the bat,
      // fly it in (he runs to his spot as it travels), then resolve.
      resetYou(POS[sc.pos]);
      const ball = $('ball'); ball.style.display = 'block';
      ball.setAttribute('r', ballRadius(sc.hitType)); resetActor(ball, HITSTART);
      if (!frozen) moveYou(youSpot);
      if (reduced) { resetActor(ball, sc.ball); runResolve(); }
      else animateFlight(sc, runResolve);
    } else {
      // Live rep: the ball already flew and sits at the fielded spot; Rylan is
      // standing where he tapped (or at home if he froze).
      resetActor($('ball'), outcome.ball[0]);
      runResolve();
    }
  }

  // Glide a chip (circle + its text label) together to a spot over `dur` ms.
  // We tween in rAF instead of CSS transitions because Chrome won't smoothly
  // transition a <text> element's x/y — the label would teleport while the dot
  // slid. A per-element token cancels an earlier move if a newer one starts.
  function glideChip(circle, label, to, dur) {
    if (!circle) return;
    const fx = +circle.getAttribute('cx'), fy = +circle.getAttribute('cy');
    const tx = to[0], ty = to[1];
    circle.style.transition = 'none'; if (label) label.style.transition = 'none';
    if (reduced || dur <= 0) {
      circle.setAttribute('cx', tx); circle.setAttribute('cy', ty);
      if (label) { label.setAttribute('x', tx); label.setAttribute('y', ty + 0.9); }
      return;
    }
    const my = (circle._glide = (circle._glide || 0) + 1), t0 = performance.now();
    (function step(t) {
      if (circle._glide !== my) return;               // superseded by a newer move
      const p = Math.min(1, (t - t0) / dur);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // easeInOut
      const cx = fx + (tx - fx) * e, cy = fy + (ty - fy) * e;
      circle.setAttribute('cx', cx); circle.setAttribute('cy', cy);
      if (label) { label.setAttribute('x', cx); label.setAttribute('y', cy + 0.9); }
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }
  // Run speed in field units/sec — reads as the player sprinting to his spot
  // rather than teleporting; a move across the infield takes ~2.5s.
  const RUNSPEED = 20;
  const chipDur = (from, to) => Math.max(800, Math.hypot(to[0] - from[0], to[1] - from[1]) / RUNSPEED * 1000);

  // Slides a supporting fielder (circle + label) to a target spot.
  function moveFielder(key, to, dur) {
    const c = $('fc-' + key), t = $('ft-' + key);
    if (!c) return;
    glideChip(c, t, to, dur || chipDur([+c.getAttribute('cx'), +c.getAttribute('cy')], to));
  }

  function animateResolution(outcome, done) {
    const ball = $('ball');
    const tail = $('balltail');
    const pts = outcome.ball;
    const hitType = lastPlay && lastPlay.sc ? lastPlay.sc.hitType : 'liner';
    const baseR = ballRadius(hitType);

    if (reduced || pts.length < 2) {
      const last = pts[pts.length - 1];
      ball.setAttribute('cx', last[0]); ball.setAttribute('cy', last[1]);
      tail.setAttribute('opacity', 0);
      setTimeout(done, reduced ? 0 : 700);
      return;
    }

    const SPEED = 46;      // field units per second
    const PAUSE = 550;     // ms a fielder holds the ball to set & throw
    const TAIL = 7;        // motion-tail length

    // Animate one leg (a throw or the hit) at a time, pausing between them.
    function runLeg(seg) {
      const a = pts[seg], b = pts[seg + 1];
      const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const legDur = Math.max(350, (d / SPEED) * 1000);
      const t0 = performance.now();
      (function step(t) {
        const f = Math.min(1, (t - t0) / legDur);
        const cx = a[0] + (b[0] - a[0]) * f, cy = a[1] + (b[1] - a[1]) * f;
        const r = (hitType === 'fly' && seg === 0) ? baseR * (1 + 0.55 * Math.sin(Math.PI * f)) : baseR;
        ball.setAttribute('r', r);
        ball.setAttribute('cx', cx); ball.setAttribute('cy', cy);
        // motion tail pointing back along this leg
        if (d > 0.5) {
          const ux = (a[0] - b[0]) / d, uy = (a[1] - b[1]) / d; // unit vector backwards
          const behind = Math.min(TAIL, f * d);
          tail.setAttribute('x1', cx + ux * behind); tail.setAttribute('y1', cy + uy * behind);
          tail.setAttribute('x2', cx); tail.setAttribute('y2', cy);
          tail.setAttribute('stroke-width', Math.max(1, r * 0.9));
          tail.setAttribute('opacity', 0.6);
        }
        if (f < 1) requestAnimationFrame(step);
        else {
          tail.setAttribute('opacity', 0);   // ball is caught — tail fades
          if (seg < pts.length - 2) setTimeout(() => runLeg(seg + 1), PAUSE); // set & throw
          else setTimeout(done, 450);
        }
      })(t0);
    }
    runLeg(0);
  }

  function moveYou(spot) {
    const dot = $('youdot'), label = $('youlabel');
    if (!dot) return;
    glideChip(dot, label, spot, chipDur([+dot.getAttribute('cx'), +dot.getAttribute('cy')], spot));
  }

  function animateNum(node, target) {
    if (reduced) { node.textContent = target; return; }
    const start = Number(node.textContent) || 0;
    const t0 = performance.now();
    function step(t) {
      const p = Math.min(1, (t - t0) / 500);
      node.textContent = Math.round(start + (target - start) * p);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function ord(n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  // TV-style scorebug: teams + score, inning with a live bases diamond, and a
  // B/S/O light cluster (balls 0–3, strikes/outs 0–2).
  function renderSituation(g, runners) {
    const on = runners || [];
    const pips = (n, total) =>
      Array.from({ length: total }, (_, i) => `<i class="p ${i < n ? 'on' : ''}"></i>`).join('');
    const base = (cx, cy, lit) =>
      `<rect x="${cx - 2.6}" y="${cy - 2.6}" width="5.2" height="5.2" transform="rotate(45 ${cx} ${cy})" ${lit ? 'fill="#fbbf24" stroke="#fbbf24"' : 'fill="none" stroke="#9fb3cf"'} stroke-width="1"/>`;
    const dia = `<svg class="dia" viewBox="0 0 22 16" aria-hidden="true">${base(11, 4.5, on.includes('2B'))}${base(17.5, 10, on.includes('1B'))}${base(4.5, 10, on.includes('3B'))}</svg>`;
    $('scorebug').innerHTML =
      `<div class="seg teams">
         <div class="tr away"><span class="tab"></span><span class="ab">AWY</span><span class="rs">${g.away}</span></div>
         <div class="tr home"><span class="tab"></span><span class="ab">HOM</span><span class="rs">${g.home}</span></div>
       </div>
       <div class="seg inn"><div class="il"><span class="ar">${g.half === 'top' ? '▲' : '▼'}</span>${ord(g.inning)}</div>${dia}</div>
       <div class="seg bso">
         <div class="bsrow b"><span class="bl">B</span><span class="pips">${pips(g.balls, 3)}</span></div>
         <div class="bsrow s"><span class="bl">S</span><span class="pips">${pips(g.strikes, 2)}</span></div>
         <div class="bsrow o"><span class="bl">O</span><span class="pips">${pips(g.outs, 2)}</span></div>
       </div>`;
  }

  function drawReference(sc) {
    const list = $('reflist'); list.innerHTML = '';
    sc.reference.forEach(([p, j]) => {
      const row = document.createElement('div');
      row.className = 'refrow' + (p === sc.pos ? ' you' : '');
      row.innerHTML = `<span class="rp">${p}</span><span class="rj">${linkify(j)}</span>`;
      list.appendChild(row);
    });
  }

  // ---- glossary: tap a term for a beginner-friendly hint ----
  const GLOSSARY = [
    { t: ['single'], d: 'A hit where the batter reaches first base safely and stops there.' },
    { t: ['double'], d: 'A hit good enough for the batter to reach second base.' },
    { t: ['triple'], d: 'A hit all the way to third base — usually a ball hit deep or into a gap.' },
    { t: ['extra bases', 'extra base'], d: 'Any base past first — a double or triple, or a runner taking another base on a bad throw. Defense tries to stop these.' },
    { t: ['scoring position', 'in scoring position'], d: 'A runner on 2nd or 3rd base — one base hit is usually enough to score him, so the defense bears down to stop the run.' },
    { t: ['corners'], d: 'Runners on first and third base at the same time ("runners on the corners").' },
    { t: ['base hit'], d: 'When the batter hits the ball and reaches a base safely.' },
    { t: ['line drive'], d: 'A ball hit hard and on a low, straight line — fast and tough to field.' },
    { t: ['ground ball', 'grounder'], d: 'A ball hit down onto the ground that rolls or bounces through the infield.' },
    { t: ['fly ball'], d: 'A ball hit high into the air out to the outfield.' },
    { t: ['pop-up', 'pop up'], d: 'A ball hit high but not far — usually caught by an infielder.' },
    { t: ['bunt'], d: 'A soft tap: the batter just holds the bat out to make the ball roll a short way.' },
    { t: ['gap'], d: 'The open space between two outfielders (left‑center or right‑center). Balls hit there roll far and often go for extra bases.' },
    { t: ['off the wall'], d: 'A ball hit so hard it bounces off the outfield fence — the hitter can take extra bases.' },
    { t: ['cutoff man', 'cutoff', 'the cut', 'cut the throw', 'cuts'], d: 'An infielder who stands between the outfielder and a base to catch (“cut”) the throw and send it wherever it’s needed.' },
    { t: ['relay man', 'relay'], d: 'A middle infielder who runs out toward a ball in the gap, takes the outfielder’s throw, and quickly relays it back in.' },
    { t: ['back up', 'backing up', 'back it up', 'backed it up', 'backed up'], d: 'Stand behind a base or fielder so if the throw gets past them, you’re there to stop it.' },
    { t: ['cover', 'covering', 'covers'], d: 'Run to stand on a base so you can catch a throw there for an out.' },
    { t: ['charge', 'charges', 'charged'], d: 'Run in fast toward a slow ball (like a bunt) so you can field it and throw sooner.' },
    { t: ['held to a single', 'hold', 'held'], d: '“Held” means you kept the runner from taking extra bases — e.g. held to a single = he only got one base.' },
    { t: ['force', 'force out', 'forced'], d: 'When a runner MUST advance, you only have to touch the base (no tag needed) to get him out.' },
    { t: ['double play'], d: 'Two outs on one batted ball — usually get the runner, then the batter.' },
    { t: ['tag up'], d: 'On a caught fly ball, a runner has to touch his base again before he’s allowed to run.' },
    { t: ['first‑to‑third', 'first-to-third'], d: 'A runner on first base running hard all the way to third on a base hit.' },
    { t: ['rounds third', 'rounding third', 'digging for home', 'races around to score', 'scores', 'score'], d: 'The runner is sprinting toward home plate to score a run.' },
    { t: ['cutoff on the throw home', 'throw home'], d: 'A throw from the outfield toward home plate to try to stop a run.' },
    { t: ['infield'], d: 'The dirt area with the four bases and the pitcher’s mound.' },
    { t: ['outfield'], d: 'The big grass area past the infield, where the three outfielders play.' },
  ];
  const GLOSS_MAP = {};
  GLOSSARY.forEach((g) => g.t.forEach((k) => { GLOSS_MAP[k.toLowerCase()] = g.d; }));
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const TERM_RE = new RegExp(
    '\\b(' + Object.keys(GLOSS_MAP).sort((a, b) => b.length - a.length).map(escRe).join('|') + ')\\b',
    'gi'
  );
  const escHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function linkify(text) {
    return escHtml(text).replace(TERM_RE, (m) => `<span class="term" data-term="${m.toLowerCase()}">${m}</span>`);
  }
  const glosspop = document.createElement('div');
  glosspop.className = 'glosspop';
  document.body.appendChild(glosspop);
  document.addEventListener('click', (e) => {
    const t = e.target.closest && e.target.closest('.term');
    if (t) {
      e.stopPropagation();
      const def = GLOSS_MAP[t.dataset.term];
      if (!def) return;
      glosspop.innerHTML = `<div class="gt">${t.textContent}</div><div class="gd">${def}</div>`;
      glosspop.style.display = 'block';
      const w = Math.min(280, window.innerWidth - 16);
      glosspop.style.width = w + 'px';
      const r = t.getBoundingClientRect();
      glosspop.style.left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8) + 'px';
      const below = r.bottom + 6;
      glosspop.style.top = (below + glosspop.offsetHeight > window.innerHeight - 8 ? r.top - glosspop.offsetHeight - 6 : below) + 'px';
    } else {
      glosspop.style.display = 'none';
    }
  });

  function render() {
    if (!order.length) buildOrder();
    if (idx >= order.length) idx = 0;
    const sc = order[idx];
    answered = false; phase = 'setup'; pick = null; flightToken++; // cancel any in-air ball
    renderSituation(sc.game, sc.runners);
    $('progress').textContent = `${posFilter === 'All' ? 'ALL' : sc.pos} · ${idx + 1}/${order.length}`;
    $('posbadge').textContent = sc.pos;
    $('premise').innerHTML = linkify(sc.play);
    $('feedback').className = 'feedback';
    // Shuffle the options → spot positions (unlabeled); the stable option.n still
    // drives per-option outcomes, so nothing else breaks.
    displayOpts = shuffle(sc.options.slice());
    displayOpts.forEach((o, i) => { o._d = i + 1; });
    drawStatic(sc);
    $('targets').innerHTML = '';   // spots only appear once the ball is live
    buildPrepitch(sc);
    drawReference(sc);

    const isQuiz = mode === 'quiz';
    $('quizUI').style.display = isQuiz ? '' : 'none';
    $('prepitch').style.display = isQuiz ? '' : 'none';
    $('readUI').style.display = 'none';
    $('refpanel').style.display = isQuiz ? 'none' : 'block';
  }

  function setDiff(d) {
    readScale = d === 'real' ? 1.05 : 1.75;
    $('diffRookie').setAttribute('aria-pressed', String(d === 'rookie'));
    $('diffReal').setAttribute('aria-pressed', String(d === 'real'));
  }

  $('playbtn').addEventListener('click', startPlay);
  $('diffRookie').addEventListener('click', () => setDiff('rookie'));
  $('diffReal').addEventListener('click', () => setDiff('real'));
  $('next').addEventListener('click', () => { idx += 1; if (idx >= order.length) { buildOrder(); idx = 0; } render(); window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); });
  $('replay').addEventListener('click', () => unfold(true));
  // ---- gear popover: holds the position filter + Quiz/Reference mode ----
  function closeGear() { $('gearmenu').setAttribute('hidden', ''); $('gearBtn').setAttribute('aria-expanded', 'false'); }
  $('gearBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const gm = $('gearmenu');
    if (gm.hasAttribute('hidden')) { gm.removeAttribute('hidden'); $('gearBtn').setAttribute('aria-expanded', 'true'); }
    else closeGear();
  });
  document.addEventListener('click', (e) => {
    if (!$('gearmenu').hasAttribute('hidden') && !$('gearmenu').contains(e.target) && e.target !== $('gearBtn')) closeGear();
  });

  $('mQuiz').addEventListener('click', () => { mode = 'quiz'; $('mQuiz').setAttribute('aria-pressed', 'true'); $('mRef').setAttribute('aria-pressed', 'false'); closeGear(); render(); });
  $('mRef').addEventListener('click', () => { mode = 'ref'; $('mRef').setAttribute('aria-pressed', 'true'); $('mQuiz').setAttribute('aria-pressed', 'false'); closeGear(); render(); });

  // ---- position filter: drill one position at a time ----
  const posbar = $('posbar');
  POSITIONS.forEach((p) => {
    const b = document.createElement('button');
    b.textContent = p; b.setAttribute('aria-pressed', String(p === posFilter));
    b.addEventListener('click', () => {
      posFilter = p; idx = 0; buildOrder();
      [...posbar.children].forEach((c) => c.setAttribute('aria-pressed', String(c.textContent === p)));
      closeGear();
      render();
    });
    posbar.appendChild(b);
  });

  buildOrder();
  render();
})();
</script>

</body>
</html>

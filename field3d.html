<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field 2.5D — standing wall + poles (projection prototype)</title>
<style>
  :root { color-scheme: dark; --sky:#0b1120; --ink:#cfe0f5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #070c16; color: var(--ink); font: 13px/1.4 'Bahnschrift','Arial Narrow',system-ui,sans-serif; overflow: hidden; }
  /* full-screen field, like the game */
  .stage { position: relative; width: 100%; max-width: 520px; height: 100dvh; margin: 0 auto; overflow: hidden;
    background: radial-gradient(90% 55% at 50% 26%, rgba(150,190,220,.10), transparent 62%), var(--sky); }
  svg#fld { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage::after { content:''; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(78% 60% at 50% 52%, transparent 60%, rgba(0,0,0,.40)); }

  /* 🎥 toggle + overlay camera panel (same pattern as the game) */
  #camtoggle { position: fixed; top: 14px; right: 14px; z-index: 70; width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid #2a3a55; background: rgba(20,35,63,.92); color: #fff; font-size: 19px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #wetoggle { position: fixed; top: 14px; right: 64px; z-index: 70; width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid #2a3a55; background: rgba(20,35,63,.92); color: #fff; font-size: 19px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #wetoggle.on { background: #b8342f; border-color: #ff7a72; }
  #wehint { position: fixed; top: 62px; right: 64px; z-index: 70; width: 172px; padding: 8px 10px; font-size: 10.5px; line-height: 1.5;
    background: rgba(11,18,32,.97); border: 1px solid #b8342f; border-radius: 10px; color: #e7eef7; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #wemirrorrow { display: flex; align-items: center; gap: 6px; margin-top: 7px; padding-top: 7px; border-top: 1px solid #2a3a55; cursor: pointer; font-weight: 700; }
  #wemirrorrow input { cursor: pointer; }
  #campanel .chkrow { display: flex; align-items: center; gap: 6px; margin: 8px 0; font-size: 11px; color: #cfe3d6; cursor: pointer; }
  #campanel .chkrow input { cursor: pointer; }
  #wetopdown { display: block; width: 100%; margin-top: 7px; padding: 5px 8px; font-size: 10.5px; font-weight: 700;
    background: rgba(20,35,63,.92); color: #cfe3d6; border: 1px solid #2a3a55; border-radius: 7px; cursor: pointer; }
  #wetopdown:hover { background: #26c565; color: #06120b; }
  #wesegrow { display: grid; grid-template-columns: 1fr 34px; align-items: center; gap: 4px 6px; margin-top: 7px; padding-top: 7px; border-top: 1px solid #2f8fe6; }
  #wesegrow span { grid-column: 1 / -1; font-weight: 700; color: #7fc0ff; }
  #wesegrow input { width: 100%; }
  #wesegrow b { text-align: right; font-variant-numeric: tabular-nums; }
  #campanel { position: fixed; top: 62px; right: 14px; z-index: 70; width: 250px; max-width: calc(100vw - 28px);
    background: rgba(11,18,32,.97); border: 1px solid #2a3a55; border-radius: 12px; padding: 12px 14px; box-shadow: 0 12px 38px rgba(0,0,0,.6); }
  #campanel .ttl { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #7fd0a3; font-size: 11px; margin-bottom: 8px; }
  #campanel label { display: grid; grid-template-columns: 56px 1fr 40px 22px; align-items: center; gap: 6px; margin: 7px 0; }
  #campanel label > span { color: #93a7c4; font-size: 11px; }
  #campanel input[type=range] { width: 100%; accent-color: #26c565; }
  #campanel b { text-align: right; font-variant-numeric: tabular-nums; color: #e8c24a; }
  #campanel .rst { padding: 0; width: 22px; height: 20px; line-height: 1; font-size: 12px; background: #12213b; border: 1px solid #2a3a55; border-radius: 5px; color: #9db4d6; cursor: pointer; }
  #campanel .rst:active { background: #26c565; color: #05130b; }
  #campanel .presets { display: flex; gap: 6px; margin-bottom: 9px; }
  #campanel .pset { flex: 1; background: #16273f; color: #cfe0f5; border: 1px solid #2a3a55; border-radius: 6px; padding: 6px 4px; font: inherit; font-size: 11px; cursor: pointer; }
  #campanel .pset:active { background: #26c565; color: #05130b; }
  #campanel .row { display: flex; gap: 7px; margin-top: 10px; }
  #campanel button { flex: 1; background: #1c2f4f; color: #fff; border: 1px solid #2a3a55; border-radius: 6px; padding: 7px; cursor: pointer; font: inherit; }
  #campanel pre { margin: 9px 0 0; padding: 7px; background: #060b16; border-radius: 6px; white-space: pre-wrap; word-break: break-word; font: 10px/1.4 ui-monospace,monospace; color: #8ea6c8; }
</style>
</head>
<body>
  <div class="stage"><svg id="fld" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid meet"></svg></div>

<script>
  const SQRT1_2 = Math.SQRT1_2;
  const polar = (deg, depth) => { const r = deg * Math.PI / 180; return { x: depth * Math.sin(r), y: depth * Math.cos(r) }; };

  // moundR/moundH are REAL feet (the mound is a fixed size, NOT a fraction of the
  // base): 18-ft diameter (9-ft radius) at every level; Little League height is
  // 6 inches (0.5 ft) vs 10 inches at HS/college/MLB.
  const CFG = {
    LL:  { name: 'Little League', base: 60, pitch: 46,   fLF: 200, fCF: 200, fRF: 200, moundR: 9, moundH: 0.5,   homeCircR: 10, backstopR: 40, backstopMin: 25, wallHt: 6, poleHt: 15 },
    MLB: { name: 'MLB',           base: 90, pitch: 60.5, fLF: 330, fCF: 400, fRF: 330, moundR: 9, moundH: 0.833, homeCircR: 13, backstopR: 60, backstopMin: 60, wallHt: 8, poleHt: 45 },
  };
  const STYLE = {
    arc:          { radiusFromMound: 1.0556 },   // infield-skin arc radius = 95ft at base 90 (from the mound)
    infieldGrass: { scale: 0.92, cutout: 0.11 },
    dirt:         { foulStrip: 0, warningTrack: 0.14 },   // foulStrip 0 = grass to the foul line in the OUTFIELD (infield skin straddles the line). home-circle radius is REAL feet per park (CFG.homeCircR: 13ft MLB / 10ft LL), like the mound.
    markers:      { baseHD: 1.4, plateScale: 1.0, chalkFoulFt: 0.5, chalkBoxFt: 0.3, baseHt: 0.4 },   // baseHD = base half-diagonal (ft). Real base 15in(LL)/18in(MLB) -> HD ~0.9-1.06; exaggerated to 1.4 for visibility. plateScale 1.0 = true 17in plate (apex pinned at origin, only the back scales). chalk widths in REAL feet (foul 4in / box 2in, lightly exaggerated) drawn as world ribbons so they scale + foreshorten.
    wall:         { panels: 6, ease: 1.7, heightFt: 12, capFt: 0.4 },   // capFt = yellow top strip height (real ft), drawn as a world band so it foreshortens/zooms with the wall
    foulPole:     { heightFt: 15, screenWFt: 1.5 },    // heightFt set live from park; screen wing = 18in (real)
    backstop:     { wallHt: 8, spanDeg: 60 },           // padded wall height (ft, short) + half-span of the arc behind home (+/-deg)
    grassDepthFt: 1.6,                                   // field-slab thickness (ft) extruded down at the outer edge
    grassLipFt: 0.5,                                     // how far the grass sits ABOVE the dirt (turf lip), fallback
    mow:          { widthFt: 0.28, opacity: 0.055 },   // band width as a fraction of base (world feet)
    colors: {
      grass:['#2c6a46','#1c4a34','#123020'], infield:['#347a4f','#265d3e'], dirt:['#c8814f','#7d4526'],
      track:'#a5794c', wall:'#0a1f14', wallFace:'#0c241a', wallTop:'#5b8a6c', wallCap:'#f4d43a', chalk:'#eef3f9', foulPole:'#e8c24a', slab:'#241a10',
    },
  };

  function buildWorld(c) {
    const d = c.base * SQRT1_2;
    // The infield is a TRUE SQUARE with side = base: home at the apex, 2B straight up
    // the middle (x=0), 1B/3B symmetric. These are the exact corners -> every base
    // path = base, both diagonals = base*sqrt2. The WHOLE field scales from these, so
    // they must be exact (do NOT bake the bag-in-fair offset in here; the corner IS the
    // bag's foul-facing edge, and the bag is merely DRAWN inside from it -- see baseSq).
    const bases = { H:{x:0,y:0}, '1B':{x:d,y:d}, '2B':{x:0,y:2*d}, '3B':{x:-d,y:d} };
    const fielders = {
      P:{x:0,y:c.pitch}, C:{x:0,y:-c.base*0.13},
      '1B':{x:d*1.02,y:d*0.82}, '2B':{x:d*0.60,y:2*d*0.86}, SS:{x:-d*0.60,y:2*d*0.86}, '3B':{x:-d*1.02,y:d*0.82},
      LF:polar(-32,c.fLF*0.72), CF:polar(0,c.fCF*0.74), RF:polar(32,c.fRF*0.72),
    };
    const wall = Array.from({length: STYLE.wall.panels+1}, (_,i) => {
      const a = -45 + (90/STYLE.wall.panels)*i;
      const pole = a <= 0 ? c.fLF : c.fRF;
      const depth = c.fCF - (c.fCF - pole) * Math.pow(Math.abs(a)/45, STYLE.wall.ease);
      return polar(a, depth);
    });
    return { bases, fielders, wall, mound:{x:0,y:c.pitch} };
  }

  const vsub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}), vadd=(a,b)=>({x:a.x+b.x,y:a.y+b.y}), vmul=(a,s)=>({x:a.x*s,y:a.y*s});
  const vnorm=a=>{const m=Math.hypot(a.x,a.y)||1;return{x:a.x/m,y:a.y/m};};
  const f2 = p => p.x.toFixed(1)+' '+p.y.toFixed(1);
  function roundDia(sv, backoff, concave) {
    let d='';
    for (let i=0;i<4;i++){
      const V=sv[i],Vp=sv[(i+3)%4],Vn=sv[(i+1)%4];
      const din=vnorm(vsub(V,Vp)),dout=vnorm(vsub(Vn,V));
      const pin=vadd(V,vmul(din,-backoff)),pout=vadd(V,vmul(dout,backoff));
      const mid={x:(pin.x+pout.x)/2,y:(pin.y+pout.y)/2};
      // concave base cutout: a SHALLOW dip toward the interior (0.4x the old depth)
      // so it reads as a gentle circular scoop, not a deep parabola.
      const ctrl=concave?{x:mid.x+(mid.x-V.x)*0.4,y:mid.y+(mid.y-V.y)*0.4}:V;
      d+=(i===0?'M ':' L ')+f2(pin)+' Q '+f2(ctrl)+' '+f2(pout);
    }
    return d+' Z';
  }

  // Infield grass diamond in WORLD feet: each edge pulled offFt INSIDE the base line,
  // each base corner scooped by a concave cutFt-radius cut-out (the sliding area). C =
  // [H,1B,2B,3B] world corners, cen = infield centre. Returns world points (project later).
  function infieldGrassWorld(C, cen, offFt, cutFt){
    const dot=(a,b)=>a.x*b.x+a.y*b.y, pts=[];
    for(let i=0;i<4;i++){
      const P0=C[(i+3)%4], P1=C[i], P2=C[(i+1)%4];
      const din=vnorm(vsub(P1,P0)), dout=vnorm(vsub(P2,P1));
      let nin={x:-din.y,y:din.x}, nout={x:-dout.y,y:dout.x};        // inward normals (toward centre)
      if(dot(nin,vsub(cen,P1))<0) nin=vmul(nin,-1);
      if(dot(nout,vsub(cen,P1))<0) nout=vmul(nout,-1);
      const h=Math.sqrt(Math.max(0,cutFt*cutFt-offFt*offFt));       // along-edge dist from base to where offset edge meets the cut circle
      const Ain=vadd(vadd(P1,vmul(nin,offFt)),  vmul(din,-h));      // offset incoming edge hits the cut circle (P0 side)
      const Aout=vadd(vadd(P1,vmul(nout,offFt)), vmul(dout, h));    // offset outgoing edge hits the cut circle (P2 side)
      pts.push(Ain);
      let a0=Math.atan2(Ain.y-P1.y,Ain.x-P1.x), a1=Math.atan2(Aout.y-P1.y,Aout.x-P1.x), da=a1-a0;
      while(da> Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI;   // concave scoop = short arc around the base
      for(let sN=1;sN<8;sN++){ const a=a0+da*sN/8; pts.push({x:P1.x+cutFt*Math.cos(a), y:P1.y+cutFt*Math.sin(a)}); }
      pts.push(Aout);
    }
    return pts;
  }

  // viewBox is set to the stage's aspect at runtime (fitViewport) so the field
  // fills the whole screen with no letterbox; the projection anchors home near
  // the bottom with sky above.
  const VB = { w:100, h:200, padX:7, padTop:8, padBottom:14 };

  // world (x=right, y=depth toward CF, z=up/height, feet) -> raw screen axes.
  //   up   = y·cos(pitch) + z·sin(pitch)  -> tilt back raises height (0 at overhead)
  //   conv = depth convergence (perspective), COUPLED TO TILT. A point's distance
  //          from the camera along the view axis grows with sin(pitch): overhead
  //          (pitch 0) is orthographic (conv=1, no horizontal convergence, correct
  //          for a map view); tilting back makes the far field recede + the foul
  //          lines converge/flatten. Measured from a plane BEHIND home (Y_NEAR) so
  //          points behind home don't fall "behind the camera" and balloon; conv
  //          stays in (0,1]. Height doesn't enter conv, so walls extrude cleanly.
  const Y_NEAR = -CFG.LL.base * 0.28;
  const rawAt = (pt, cP, sP, k) => {
    const z = pt.z || 0;
    const up = pt.y * cP + z * sP;
    const conv = 1 / Math.max(1 + (pt.y - Y_NEAR) * sP * k, 0.05);
    return { X: pt.x * conv, Y: up * conv };
  };
  // Base scale + anchor are computed ONCE per fit (reference pitch) and held
  // FIXED, so tilting genuinely stands the wall UP instead of an auto-fit
  // scaling its height back down. Home (origin) is the pivot, pinned near bottom.
  let BASE = null;
  function computeBase() {
    const w = buildWorld(CFG[cam.park] || CFG.LL);
    const p = DEF.pitch*Math.PI/180, cP = Math.cos(p), sP = Math.sin(p), k = DEF.k;
    const H = cam.wallH, PH = cam.poleH, ext = [];
    w.wall.forEach(v => { ext.push({x:v.x,y:v.y,z:0}); ext.push({x:v.x,y:v.y,z:H}); });
    const L = w.wall[0], R = w.wall[w.wall.length-1];
    ext.push({x:L.x,y:L.y,z:PH}, {x:R.x,y:R.y,z:PH});
    Object.values(w.bases).forEach(b => ext.push(b)); ext.push(w.fielders.C);
    const Rs = ext.map(pt => rawAt(pt, cP, sP, k)), Xs = Rs.map(r=>r.X), Ys = Rs.map(r=>r.Y);
    const S0 = Math.min((VB.w-2*VB.padX)/(Math.max(...Xs)-Math.min(...Xs)), (VB.h-VB.padTop-VB.padBottom)/(Math.max(...Ys)-Math.min(...Ys)));
    BASE = { S0, homeY0: VB.h - VB.padBottom - 3 };
  }
  function makeCamera(w, cam) {
    const p = cam.pitch*Math.PI/180, cP = Math.cos(p), sP = Math.sin(p), k = cam.k;
    const y = (cam.yaw||0)*Math.PI/180, cY = Math.cos(y), sY = Math.sin(y);
    const S = BASE.S0 * cam.zoom, cx = VB.w/2 + cam.panX, homeY = BASE.homeY0 + cam.panY;
    const fwd = cam.fwd || 0, camZ = cam.camZ || 0, strafe = cam.strafe || 0;
    const P = (pt) => {
      // fwd/strafe/camZ move the CAMERA -- and orient to the CAMERA'S yaw frame, so W is
      // always "into the screen" and A/D are the camera's left/right no matter how it's
      // rotated. Camera forward (world) = (sinYaw,cosYaw), right = (cosYaw,-sinYaw); the
      // world shifts opposite. camZ is world height. All applied before pitch projection.
      const px = pt.x - fwd*sY - strafe*cY, py = pt.y - fwd*cY + strafe*sY;
      const rx = px*cY - py*sY, ry = px*sY + py*cY;
      const r = rawAt({ x: rx, y: ry, z: (pt.z||0) - camZ }, cP, sP, k);
      return { x: cx + r.X*S, y: homeY - r.Y*S };
    };
    // Inverse: screen pixel -> world point on the GROUND plane (z=0). Closed-form because
    // the pitch projection's convergence is linear in ry. Used by the wall vertex editor
    // so a dragged handle lands exactly where it's dropped on the field, at any camera angle.
    P.inv = (sx, sy) => {
      const Xv = (sx - cx) / S, Yv = (homeY - sy) / S;
      const ry = (Yv * (sP*k*Y_NEAR - 1) - camZ*sP) / (Yv*sP*k - cP);   // solve conv/pitch for ry
      const D = 1 + (ry - Y_NEAR) * sP * k;                              // 1/conv at that ry
      const rx = Xv * D;
      const px = rx*cY + ry*sY, py = -rx*sY + ry*cY;                     // un-yaw
      return { x: px + fwd*sY + strafe*cY, y: py + fwd*cY - strafe*sY }; // un-translate
    };
    return P;
  }

  const arcPts = (cxw,cyw,r,a0,a1,n) => Array.from({length:n+1},(_,i)=>{const a=a0+(a1-a0)*i/n;return{x:cxw+r*Math.cos(a),y:cyw+r*Math.sin(a)};});
  const circPts = (cxw,cyw,r,n) => Array.from({length:n},(_,i)=>{const a=2*Math.PI*i/n;return{x:cxw+r*Math.cos(a),y:cyw+r*Math.sin(a)};});

  // ---- Editable stadium walls (world coords, feet) ---------------------------------
  // The foul-territory SIDE WALLS run from each backstop end out to the outfield foul
  // pole, through foul ground. Vertices are user-editable (drag / add / remove via the
  // wall editor). Defaults are MLB-scaled with a couple of angles so the wall has some
  // character instead of a dead-straight run. sideR[0]/sideL[0] sit at the backstop ends;
  // the last vertex of each sits on its foul pole.
  const EDIT = {
    outfield: null,  // editable outfield fence (lazy-seeded from the park's parametric arc)
    backstop: null,  // editable backstop (lazy-seeded); vertices clamped to a min radius from home
    sideR: [ {x:52,y:-30}, {x:150,y:6}, {x:225,y:135}, {x:233,y:233} ],
    sideL: [ {x:-52,y:-30}, {x:-150,y:6}, {x:-225,y:135}, {x:-233,y:233} ],
    mode: false,   // wall-editor toggle
    mirror: true,  // keep the two side walls symmetric on edit
    selV: null,    // currently selected vertex { w, i } for height editing / delete
    _park: undefined,
  };
  // every editable wall + its per-wall behaviour (height fallback source, cap colour, mirror
  // partner, min-radius-from-home). Iterated by the renderer AND the editor.
  const WALLS = ['outfield','backstop','sideR','sideL'];
  const WCFG = {
    outfield: { hKey:'wallH', cap:'wallCap', mirror:null },
    backstop: { hKey:'bsH',   cap:null,      mirror:null },
    sideR:    { hKey:'sideH',  cap:'slab',    mirror:'sideL' },
    sideL:    { hKey:'sideH',  cap:'slab',    mirror:'sideR' },
  };
  const genBackstop = c => { const r=c.backstopR, span=STYLE.backstop.spanDeg, a=[];
    for (let dg=-span; dg<=span; dg+=15){ const t=dg*Math.PI/180; a.push({x:r*Math.sin(t), y:-r*Math.cos(t)}); } return a; };   // coarse enough to edit cleanly
  const genSide = (bsEnd, pole) => { const p=[{x:bsEnd.x,y:bsEnd.y}];   // straight run backstop-end -> pole, 2 mids
    for (const t of [0.4,0.72]) p.push({x:bsEnd.x+(pole.x-bsEnd.x)*t, y:bsEnd.y+(pole.y-bsEnd.y)*t});
    p.push({x:pole.x,y:pole.y}); return p; };

  function renderField(cam) {
    const c = CFG[cam.park] || CFG.LL, w = buildWorld(c), P = makeCamera(w, cam);
    EDIT._P = P;   // expose the current projector (+ its .inv) to the wall editor's mouse handlers
    const pj = pt => { const s = P(pt); return s.x.toFixed(1)+','+s.y.toFixed(1); };
    const path = pts => 'M ' + pts.map(pj).join(' L ');
    // worldLine: draw a polyline as a REAL-width ribbon (wFt feet) in WORLD space,
    // then project -> it foreshortens + scales with zoom exactly like every filled
    // area, so nothing is locked to screen pixels. Offsets each vertex by the (miter)
    // average of its adjacent segment normals. closed=true -> a loop (evenodd annulus).
    const worldLine = (pts, wFt, fill, opacity=0.8, closed=false) => {
      const n = pts.length; if (n < 2) return '';
      const m = closed ? n : n-1, sn = [];
      for (let i=0;i<m;i++){ const a=pts[i], b=pts[(i+1)%n];
        const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1; sn.push({x:-dy/L, y:dx/L}); }
      const vn = i => { const a = closed ? sn[(i-1+m)%m] : sn[Math.max(0,i-1)],
                              b = closed ? sn[i%m]       : sn[Math.min(m-1,i)];
        const x=a.x+b.x, y=a.y+b.y, L=Math.hypot(x,y)||1; return {x:x/L, y:y/L}; };
      const h=wFt/2, Lft=[], Rgt=[];
      for (let i=0;i<n;i++){ const v=pts[i], q=vn(i);
        Lft.push({x:v.x+q.x*h, y:v.y+q.y*h}); Rgt.push({x:v.x-q.x*h, y:v.y-q.y*h}); }
      const d = closed ? path(Lft)+' Z '+path(Rgt.slice().reverse())+' Z'
                       : path(Lft.concat(Rgt.slice().reverse()))+' Z';
      return `<path d="${d}" fill="${fill}"${closed?' fill-rule="evenodd"':''} opacity="${opacity}"/>`;
    };
    const B = w.bases, H = STYLE.wall.heightFt, PH = STYLE.foulPole.heightFt;
    const CF = STYLE.markers.chalkFoulFt, CB = STYLE.markers.chalkBoxFt, CK = STYLE.colors.chalk;   // chalk widths (ft) + colour
    const cen = { x:0, y:c.base*SQRT1_2 };
    const lerp = (b,f) => ({ x: cen.x+(b.x-cen.x)*f, y: cen.y+(b.y-cen.y)*f });

    // INIT / regenerate editable walls from the park's parametric geometry. First load seeds
    // outfield + backstop (side walls keep their hand-tuned defaults); a PARK CHANGE regenerates
    // all four to the new park (discarding edits, as chosen). EDIT.outfield/backstop then drive
    // every wall-dependent thing below (grass boundary, apron, foul lines, warning track, poles).
    if (!EDIT.outfield || EDIT._park !== cam.park) {

    // SNAP TARGETS for the wall editor = the ENDS of every editable wall, so a dragged vertex

    EDIT._snap = []; for (const wk of WALLS){ const a=EDIT[wk]; if (a && a.length) EDIT._snap.push(a[0], a[a.length-1]); }

    // -> right side wall -> outfield fence -> left side wall (all editable polylines).
    const apronPts = [ ...EDIT.backstop, ...EDIT.sideR, ...[...EDIT.outfield].reverse(), ...[...EDIT.sideL].reverse() ];
    const apron = path(apronPts) + ' Z';
    // GRASS DEPTH: extrude the field's outer edge DOWN by grassDepthFt so the ground
    // reads as a raised slab with thickness (grass top at z=0, dark soil side below).
    const slabD = cam.grassD ?? STYLE.grassDepthFt;
    let grassLip = '';
    for (let i=0;i<apronPts.length;i++){ const a=apronPts[i], b=apronPts[(i+1)%apronPts.length];
      grassLip += `<path d="${path([{...a,z:0},{...b,z:0},{...b,z:-slabD},{...a,z:-slabD}])} Z" fill="${STYLE.colors.slab}" stroke="none"/>`;

    // straddle fan here AND the outfield-grass boundary below.
    const arcHit = (A,D) => { const E={x:A.x, y:A.y-cyw};
      const b=E.x*D.x+E.y*D.y, s=-b+Math.sqrt(Math.max(0, b*b-(E.x*E.x+E.y*E.y-Rarc*Rarc)));

    // the infield skin STRADDLES the foul line: its foul-side edge is the foul line
    // pushed stradFt INTO foul (mirrors the 3ft grass offset, so the foul line is

    // then the arc curves in and grass takes the foul line the rest of the way to the pole.
    const stradFt = c.base/30;
    const dRf={x:SQRT1_2,y:SQRT1_2}, dLf={x:-SQRT1_2,y:SQRT1_2};              // foul-line directions

    const arc=arcPts(0,cyw,Rarc,Math.atan2(rArc.y-cyw,rArc.x),Math.atan2(lArc.y-cyw,lArc.x),26);
    const dirtFan = path([rNear, rArc, ...arc, lArc, lNear]) + ' Z';
    const rAt = ft => { const a=P({x:0,y:0}), b=P({x:0,y:ft}); return Math.hypot(a.x-b.x,a.y-b.y); };
    const trackW=rAt(c.base*STYLE.dirt.warningTrack), foulW=rAt(c.base*STYLE.dirt.foulStrip);
    // home-area box geometry (real feet). boxYc = plate square centre (apex y=0 ->
    // front y=1.42); batter's box centres on it. catcher's box back is 8ft FROM THE
    // APEX (catBack=-8) -- that 8ft is a distance from home, NOT the box length.
    const boxYc = 0.71, catFront = boxYc-3, catBack = -8;

    // from the APEX of home plate (authoritative -- NCSU/field-layout spec), same datum
    // as everything else. (An earlier "centre on the box midline" idea was wrong.)
    const homeCircle = path(circPts(0, 0, c.homeCircR, 24)) + ' Z';
    // the mound is a LOW ROUNDED dome. Build it from stacked rings on a dome profile
    // (radius shrinks + height rises along a quarter-sine), each level drawn as a
    // side band + a disc, so the silhouette curves and rounds off at the top instead
    // of being a tall flat-topped frustum. Kept low (moundHeightFt) so it sits close
    // to the ground. One SOLID piece at any camera angle.
    const mR = c.moundR, mH = c.moundH, RN = 7;   // real feet: 9-ft radius, 0.5-ft (6in) LL height
    // rings converge to a rounded TIP (cos ~-> 0 near the top) so there is no flat
    // cap disc, and all rings share the dirt gradient so it reads as ONE smooth
    // dome, not a stack with a lighter disc sitting on top.
    const mRing = t => { const a = t*Math.PI/2; return circPts(0, c.pitch, Math.max(mR*Math.cos(a*0.97), 0.2), 22).map(p=>P({x:p.x,y:p.y,z:mH*Math.sin(a)})); };
    const mrings = Array.from({length:RN}, (_,i)=>mRing(i/(RN-1)));
    const ps = a => 'M ' + a.map(s=>s.x.toFixed(1)+','+s.y.toFixed(1)).join(' L ') + ' Z';
    const xl = a => a.reduce((m,p)=>p.x<m.x?p:m), xr = a => a.reduce((m,p)=>p.x>m.x?p:m);
    let moundBody = `<path d="${ps(mrings[0])}" fill="url(#dirtg)"/>`;
    for (let i=1;i<RN;i++){ const A=mrings[i-1], B=mrings[i], al=xl(A),ar=xr(A),blp=xl(B),brp=xr(B);
      moundBody += `<path d="M ${al.x.toFixed(1)},${al.y.toFixed(1)} L ${blp.x.toFixed(1)},${blp.y.toFixed(1)} L ${brp.x.toFixed(1)},${brp.y.toFixed(1)} L ${ar.x.toFixed(1)},${ar.y.toFixed(1)} Z" fill="url(#dirtg)"/>`;
      moundBody += `<path d="${ps(B)}" fill="url(#dirtg)"/>`;
    }
    // pitching rubber: white slab (24in x 6in) on the mound top at the pitch distance.
    const rubber = `<path d="${path([{x:-1,y:c.pitch-0.25,z:mH},{x:1,y:c.pitch-0.25,z:mH},{x:1,y:c.pitch+0.25,z:mH},{x:-1,y:c.pitch+0.25,z:mH}])} Z" fill="#eef1f6" stroke="none"/>`;
    const bs=[B.H,B['1B'],B['2B'],B['3B']];
    // infield grass = real 3ft-inside-the-baseline diamond with 13ft concave cut-outs
    // at each bag (cut = the home-circle radius, so bag cut-outs match the home circle).
    const grassOffFt = c.base/30;                       // 3ft at base 90 (scales with park)
    const grassCutFt = c.homeCircR;                     // base cut-outs = home-circle radius (13ft MLB / 10ft LL, real)
    // GRASS LIP: grass surfaces sit grassLift ft ABOVE the dirt, with a green step (lip
    // face) at every grass-dirt boundary -- the real turf-over-skin edge (distinct from
    // the field-slab soil edge). grassLift from the panel slider.
    const grassLift = cam.grassLip ?? STYLE.grassLipFt;
    const raise = pts => pts.map(p => ({x:p.x, y:p.y, z:grassLift}));
    const grassLipFace = pts => { let s=''; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length];
      s += `<path d="${path([{x:a.x,y:a.y,z:0},{x:b.x,y:b.y,z:0},{x:b.x,y:b.y,z:grassLift},{x:a.x,y:a.y,z:grassLift}])} Z" fill="${STYLE.colors.grass[2]}" stroke="none"/>`; } return s; };
    const grassInPts = infieldGrassWorld(bs, cen, grassOffFt, grassCutFt);
    const grassIn = path(raise(grassInPts)) + ' Z';
    const infLip = grassLipFace(grassInPts);
    // the mound is a dirt circle in the grass, so the grass is raised around it too
    const moundLip = grassLipFace(circPts(0, c.pitch, mR, 22));
    // foul chalk starts where the (45deg) foul line crosses the batter's box TOP
    // edge (y = 3) — so it CONNECTS to the box corner instead of running through it
    // or floating out past it. All the home-plate chalk shares these box coords.
    // All chalk below is defined as WORLD point arrays and rendered via worldLine
    // (real-width ribbons) so it scales/foreshortens with the field, never screen-locked.
    // boxes are positioned relative to the PLATE, whose apex is the datum. boxYc =
    // (boxYc / catFront / catBack are defined up with the home dirt circle.)
    // FOUL LINES are ANCHORED at the apex (collinear with apex->pole at 45deg, so the
    // plate's 12in edges still define their direction) but the DRAWN line becomes visible
    // AT the batter's-box FRONT edge (y = boxYc+3) and runs out to the pole -- nothing is
    // drawn between home and the box. We start the ribbon 2ft INSIDE the box and let the
    // box dirt-fill occlude it up to the front edge, so the visible end is cut FLUSH along
    // that horizontal edge (not a 90deg/diagonal ribbon cap).
    const boxFront = boxYc + 3, foulStart = boxFront - 2;
    const foulLPts = [{x:-foulStart, y:foulStart}, EDIT.outfield[0]], foulRPts = [{x:foulStart, y:foulStart}, EDIT.outfield[EDIT.outfield.length-1]];
    // batter's box: 4ft x 6ft, inner edge 6in off the plate (half-width 0.71 -> inner
    // x 1.21, outer 5.21), centred lengthwise on the plate mid.
    const bboxPts = sx => [{x:sx*1.21,y:boxYc-3},{x:sx*5.21,y:boxYc-3},{x:sx*5.21,y:boxYc+3},{x:sx*1.21,y:boxYc+3}];  // closed
    // catcher's box: real 43in wide (x +/-1.79), squared U OPEN toward the plate; front
    // at the batter's-box back (catFront), back 8ft from the apex (catBack=-8).
    const catBoxPts = [{x:1.79,y:catFront},{x:1.79,y:catBack},{x:-1.79,y:catBack},{x:-1.79,y:catFront}];   // open U
    // coach's boxes: MLB 20ft long (along the foul line) x 10ft wide, near edge 15ft off
    // the line, in foul territory beside each base. L = distance along the foul line
    // (base = 1B/3B at L=c.base); P = perpendicular into foul.
    const nRf={x:SQRT1_2,y:-SQRT1_2}, nLf={x:-SQRT1_2,y:-SQRT1_2};                 // into-foul normals
    const coachBox = (dir, nf) => { const q=(L,P)=>({x:dir.x*L+nf.x*P, y:dir.y*L+nf.y*P});
      return [q(c.base-10,15), q(c.base+10,15), q(c.base+10,25), q(c.base-10,25)]; };
    const cbox1 = coachBox(dRf, nRf), cbox3 = coachBox(dLf, nLf);
    // runner's lane (1B only): 3ft into foul, parallel to the 1B line, covering the 2nd

    const rl=(L,P)=>({x:dRf.x*L+nRf.x*P, y:dRf.y*L+nRf.y*P});

    const hm = P(B.H);
    // dirt gradient range = the dirt's OWN screen extent (far edge light -> near
    // edge dark), so it keeps the lighter look while staying userSpaceOnUse-
    // consistent across both dirt paths (no seam).
    const dirtY1 = P({x:0, y:c.fCF}).y;              // far wall edge (light stop)
    const dirtY2 = P({x:0, y:-c.base*0.28}).y;       // behind-home edge (dark stop)

    const psc = STYLE.markers.plateScale;
    const plate = path([{x:0,y:0},{x:0.71*psc,y:0.71*psc},{x:0.71*psc,y:1.42*psc},{x:-0.71*psc,y:1.42*psc},{x:-0.71*psc,y:0.71*psc}]) + ' Z';

    // ---- WALL EXTRUSION (unified across all editable walls) ------------------------

      };

    };

    const fld = Object.entries(w.fielders).map(([k,p])=>{const s=P(p);return `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="2.1" fill="#0c1a12" stroke="#8fb6a0" stroke-width=".5"/><text x="${s.x.toFixed(1)}" y="${(s.y+.8).toFixed(1)}" text-anchor="middle" font-size="2.1" fill="#cfe3d6" font-family="Bahnschrift,sans-serif">${k}</text>`;}).join('');

    const bd = STYLE.markers.baseHD, bh = bd/2;   // base half-diagonal, ft (see STYLE.markers)

    // with their foul-facing edge along the foul line (centered on the corner). The

    // along each foul line's inward (fair) normal: 1B -> (-bh,+bh), 3B -> (+bh,+bh).
    const bagCtr = { '1B':{x:B['1B'].x-bh, y:B['1B'].y+bh}, '2B':B['2B'], '3B':{x:B['3B'].x+bh, y:B['3B'].y+bh} };

      const cor = [{x:ctr.x,y:ctr.y+bd},{x:ctr.x+bd,y:ctr.y},{x:ctr.x,y:ctr.y-bd},{x:ctr.x-bd,y:ctr.y}];

    // ---- DIRT IS ONE SHAPE. Instead of stroking separate bands (which don't
    //      foreshorten and use their own colour), we fill the whole fair region
    //      with dirt and cut ONE outfield-grass polygon out on top. Whatever the
    //      grass doesn't cover = the single connected dirt skin: infield + foul
    //      strips + warning track, all the same gradient, all foreshortening
    //      correctly because they're real filled world-space regions. The grass

    //      bounded on the infield side by the grass-line arc. ----
    const nrm = v => { const m = Math.hypot(v.x,v.y)||1; return {x:v.x/m, y:v.y/m}; };
    const trackFt = c.base*STYLE.dirt.warningTrack, foulFt = c.base*STYLE.dirt.foulStrip;
    const iWall = EDIT.outfield.map(v => { const m = Math.hypot(v.x,v.y); const s = (m-trackFt)/m; return {x:v.x*s, y:v.y*s}; });
    const dR = nrm(EDIT.outfield[EDIT.outfield.length-1]), nR = {x:-dR.y, y:dR.x};   // right foul inward normal (into fair)
    const dL = nrm(EDIT.outfield[0]),                      nL = {x: dL.y, y:-dL.x};  // left foul inward normal
    // The outfield grass boundary along a foul line is that foul line pushed
    // foulFt into fair. It meets the dirt at TRUE intersection POINTS — where the
    // offset line crosses the grass-line arc (inner) and the inset wall (outer) —
    // NOT via a perpendicular cap, which used to leave a notch/seam at each of the
    // 4 foul-line corners. (arcHit is defined up with the straddle fan and reused here.)
    const segHit = (A,D,P,Q) => { const Dq={x:Q.x-P.x,y:Q.y-P.y}, den=D.x*Dq.y-D.y*Dq.x;
      if(Math.abs(den)<1e-9) return Q;
      const t=((P.x-A.x)*Dq.y-(P.y-A.y)*Dq.x)/den; return {x:A.x+D.x*t, y:A.y+D.y*t}; };
    const AR = {x:foulFt*nR.x, y:foulFt*nR.y}, AL = {x:foulFt*nL.x, y:foulFt*nL.y};  // points on the offset foul lines
    const N = iWall.length;
    const innerR = arcHit(AR, dR), innerL = arcHit(AL, dL);           // grass foul edge meets the arc
    const outerR = segHit(AR, dR, iWall[N-2], iWall[N-1]), outerL = segHit(AL, dL, iWall[1], iWall[0]); // meets warning-track edge
    const angOf = p => Math.atan2(p.y-cyw, p.x);
    const arcSeg = arcPts(0, cyw, Rarc, angOf(innerL), angOf(innerR), 24);            // grass line between the two corners
    const outGrassPts = [ innerR, outerR, ...iWall.slice(1, N-1).reverse(), outerL, innerL, ...arcSeg ];
    const outGrass = path(raise(outGrassPts)) + ' Z';
    const outLip = grassLipFace(outGrassPts);

    // mow stripes: WORLD-space bands PROJECTED through the camera (converge +
    // foreshorten with the field), clipped to the outfield grass. HARD-edged
    // (real mow strips are hard).
    // mow bands generated per REGION so the infield and outfield can have different
    // stripe widths (real fields use smaller mowers in the infield). scale multiplies
    // the base band width; 0 = no stripes. Coverage sized to the park (widest = the foul
    // poles at 45deg, deepest = center field); clipped to each grass below.
    const mowX = Math.max(c.fLF, c.fRF)*SQRT1_2 + 50, mowY = c.fCF + 50;
    const mowBands = scale => { if (!(scale > 0)) return ''; const bandFt = c.base*STYLE.mow.widthFt*scale, period = 2*bandFt; let s='';
      // center a stripe on x=0 (the mound / CF / home center line) so the pattern is
      // SYMMETRIC about the field's axis, not offset.
      let x0 = -bandFt/2; while (x0 > -mowX) x0 -= period;
      for (let x=x0; x<mowX; x += period) {
        const quad = [{x, y:-4, z:grassLift}, {x:x+bandFt, y:-4, z:grassLift}, {x:x+bandFt, y:mowY, z:grassLift}, {x, y:mowY, z:grassLift}];
        s += `<path d="${path(quad)} Z" fill="#eafff4" opacity="${STYLE.mow.opacity}"/>`;
      }
      return s; };
    const mowOut = mowBands(cam.mowOut ?? 1), mowIn = mowBands(cam.mowIn ?? 0.5);

    // WALL EDITOR overlay: draggable vertex handles + per-segment length labels + a "+"
    // insert button at each segment midpoint. Screen-constant sizes (drawn at projected
    // ground points), painted last so they sit on top. Only when EDIT.mode is on.
    let weLayer = '';
    if (EDIT.mode) {
      // backstop minimum-radius ring (regulation floor from home) -- shown so you can see the limit
      if (EDIT._backstopMin){ const ring = circPts(0, 0, EDIT._backstopMin, 48).map(p=>P({...p,z:0}));
        weLayer += `<path d="M ${ring.map(s=>s.x.toFixed(1)+','+s.y.toFixed(1)).join(' L ')} Z" fill="none" stroke="#e2352d" stroke-width=".4" stroke-dasharray="2 2" opacity=".5"/>`; }
      for (const wk of WALLS) { const pts = EDIT[wk];
        for (let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1];
          const Lft = Math.hypot(b.x-a.x, b.y-a.y), mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
          const sm = P({...mid, z:0});
          // read-only length label (height now lives on vertices, not segments)
          weLayer += `<text x="${sm.x.toFixed(1)}" y="${(sm.y-0.9).toFixed(1)}" text-anchor="middle" font-size="2.4" fill="#ffe08a" stroke="#000" stroke-width=".5" paint-order="stroke" font-family="Bahnschrift,sans-serif" pointer-events="none">${Lft.toFixed(0)}'</text>`;
          weLayer += `<g class="we-add" data-w="${wk}" data-seg="${i}" style="cursor:copy"><circle cx="${sm.x.toFixed(1)}" cy="${(sm.y+2.2).toFixed(1)}" r="1.9" fill="#1c9b5e" stroke="#fff" stroke-width=".4"/><text x="${sm.x.toFixed(1)}" y="${(sm.y+3.1).toFixed(1)}" text-anchor="middle" font-size="2.8" fill="#fff" font-family="Bahnschrift,sans-serif" pointer-events="none">+</text></g>`;
        }
        for (let i=0;i<pts.length;i++){ const sp = P({...pts[i], z:0});
          const vsel = EDIT.selV && EDIT.selV.w===wk && EDIT.selV.i===i;   // click (vs drag) selects a vertex
          weLayer += `<circle class="we-vh" data-w="${wk}" data-i="${i}" cx="${sp.x.toFixed(1)}" cy="${sp.y.toFixed(1)}" r="${vsel?2.7:2.3}" fill="${vsel?'#2f8fe6':'#fff'}" stroke="${vsel?'#eaf4ff':'#e2352d'}" stroke-width=".8" style="cursor:grab"/>`;
          if (vsel){ const dx=sp.x+4.4, dy=sp.y-4.4;   // × delete icon on the selected vertex
            weLayer += `<g class="we-del" data-w="${wk}" data-i="${i}" style="cursor:pointer"><circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="2.1" fill="#c0322c" stroke="#fff" stroke-width=".45"/><text x="${dx.toFixed(1)}" y="${(dy+0.9).toFixed(1)}" text-anchor="middle" font-size="2.9" fill="#fff" font-family="Bahnschrift,sans-serif" pointer-events="none">×</text></g>`;
          }
        }
        // ANGLE labels at each interior vertex: the bend between its two segments. Placed just
        // outside the corner (along the outward bisector). Turns green at ~180 deg (straight).
        for (let i=1;i<pts.length-1;i++){ const v=pts[i], A=pts[i-1], C=pts[i+1];
          const va={x:A.x-v.x,y:A.y-v.y}, vc={x:C.x-v.x,y:C.y-v.y};
          const ang=Math.abs(Math.atan2(va.x*vc.y-va.y*vc.x, va.x*vc.x+va.y*vc.y))*180/Math.PI;
          const la=Math.hypot(va.x,va.y)||1, lc=Math.hypot(vc.x,vc.y)||1;
          let ox=-(va.x/la+vc.x/lc), oy=-(va.y/la+vc.y/lc); const ol=Math.hypot(ox,oy);
          if (ol<0.15){ ox=-va.y/la; oy=va.x/la; } else { ox/=ol; oy/=ol; }   // outward bisector (~straight -> perpendicular)
          // offset the label in SCREEN space by a fixed amount so it always clears the handle,
          // whatever the zoom: project the vertex + a point along the outward bisector, then step
          // a constant number of viewBox units along that screen direction.
          const vs=P({x:v.x,y:v.y,z:0}), os=P({x:v.x+ox*10,y:v.y+oy*10,z:0});
          let sdx=os.x-vs.x, sdy=os.y-vs.y; const sl=Math.hypot(sdx,sdy)||1;
          const ap={x: vs.x+sdx/sl*4.6, y: vs.y+sdy/sl*4.6 + 0.8}, straight=ang>=179.4;
          weLayer += `<text x="${ap.x.toFixed(1)}" y="${ap.y.toFixed(1)}" text-anchor="middle" font-size="2.3" fill="${straight?'#7dff9b':'#bfe0ff'}" stroke="#000" stroke-width=".5" paint-order="stroke" font-family="Bahnschrift,sans-serif" pointer-events="none">${ang.toFixed(0)}°</text>`;
        }
      }
    }

    return `
      <defs>
        <radialGradient id="grassg" cx="50%" cy="78%" r="95%"><stop offset="0%" stop-color="${STYLE.colors.grass[0]}"/><stop offset="55%" stop-color="${STYLE.colors.grass[1]}"/><stop offset="100%" stop-color="${STYLE.colors.grass[2]}"/></radialGradient>
        <radialGradient id="infg" cx="50%" cy="70%" r="80%"><stop offset="0%" stop-color="${STYLE.colors.infield[0]}"/><stop offset="100%" stop-color="${STYLE.colors.infield[1]}"/></radialGradient>
        <linearGradient id="dirtg" gradientUnits="userSpaceOnUse" x1="0" y1="${dirtY1.toFixed(1)}" x2="0" y2="${dirtY2.toFixed(1)}"><stop offset="0%" stop-color="${STYLE.colors.dirt[0]}"/><stop offset="100%" stop-color="${STYLE.colors.dirt[1]}"/></linearGradient>
        <linearGradient id="wallface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${STYLE.colors.wallTop}"/><stop offset="14%" stop-color="${STYLE.colors.wallFace}"/><stop offset="100%" stop-color="${STYLE.colors.wall}"/></linearGradient>
        <radialGradient id="moundg" cx="42%" cy="36%" r="72%"><stop offset="0%" stop-color="#d9955f"/><stop offset="100%" stop-color="${STYLE.colors.dirt[1]}"/></radialGradient>
        <clipPath id="outgrass"><path d="${outGrass}"/></clipPath>
        <clipPath id="infgrass"><path d="${grassIn}"/></clipPath>
      </defs>
      <!-- GROUND LAYER: dirt. Separate SOLID paths (fair fan + home-plate dirt)
           sharing ONE userSpaceOnUse gradient — so overlapping subpaths can't
           cancel into a see-through hole, and every dirt region samples the same
           gradient (no region-to-region colour seam). -->
      <!-- field-slab thickness (extruded edge) UNDER the ground surface -->
      ${grassLip}
      <!-- foul-territory + backstop grass apron UNDER everything -->
      <path d="${apron}" fill="${STYLE.colors.grass[1]}"/>
      <path d="${grass}" fill="url(#dirtg)"/>
      <path d="${homeCircle}" fill="url(#dirtg)"/>
      <!-- the straddle fan adds the 3ft dirt strip on the FOUL side of each foul line
           (home -> the 95ft arc), so the foul line sits centred in dirt -->
      <path d="${dirtFan}" fill="url(#dirtg)"/>
      <!-- GRASS grows on top of the dirt (outfield), raised slightly (grass lip) -->
      ${outLip}
      <path d="${outGrass}" fill="url(#grassg)"/>
      <g clip-path="url(#outgrass)">${mowOut}</g>
      <!-- standing wall + lit top edge -->
      ${faces}
      ${caps}
      <!-- distance markers painted on the outfield fence -->
      ${fenceDist}
      <!-- infield grass patch, raised slightly above the dirt (grass lip) -->
      ${infLip}
      <path d="${grassIn}" fill="url(#infg)"/>
      <g clip-path="url(#infgrass)">${mowIn}</g>
      <!-- the mound: grass lip around its dirt circle, the dome, then the rubber on top -->
      ${moundLip}
      ${moundBody}
      ${rubber}
      <!-- chalk as REAL-width world ribbons (foul ~4in : box ~2in), via worldLine so
           they foreshorten + scale with the field instead of ballooning when zoomed out -->
      ${worldLine(foulLPts, CF, CK)}
      ${worldLine(foulRPts, CF, CK)}
      <!-- foul line must NEVER be visible inside a batter's box. The line now STARTS at
           the box front edge, but its ribbon has a little width, so re-fill each box
           interior with the SAME dirt (they sit inside the home circle) to occlude any
           start-cap overhang, THEN stroke the box outline on top. -->
      <path d="${path(bboxPts(-1))} Z" fill="url(#dirtg)"/>
      <path d="${path(bboxPts(1))} Z" fill="url(#dirtg)"/>
      ${worldLine(bboxPts(-1), CB, CK, 0.8, true)}
      ${worldLine(bboxPts(1),  CB, CK, 0.8, true)}
      ${worldLine(catBoxPts,   CB, CK)}
      <!-- coach's boxes (1B/3B) + first-base runner's lane, foul-territory chalk -->
      ${worldLine(cbox1, CB, CK, 0.8, true)}
      ${worldLine(cbox3, CB, CK, 0.8, true)}
      ${worldLine(runLane, CB, CK)}
      <path d="${plate}" fill="#f4f7fb"/>
      ${baseSq}
      ${fld}
      ${pole(EDIT.outfield[0], nL)}${pole(EDIT.outfield[EDIT.outfield.length-1], nR)}
      <!-- foul-territory side walls (backstop -> foul poles) -->
      ${sideWalls}
      <!-- backstop (foreground, behind home) -->
      ${backstop}
      <!-- scale-reference human billboard (on top) -->
      ${billboard}
      <!-- wall-editor overlay (handles / dimensions / add buttons) -->
      ${weLayer}
    `;
  }

  // ---- camera state ----
  // wallH/poleH default to the LL regulation (CFG.LL.wallHt/poleHt); the park
  // toggle resets them to that park's regulation. Presets only move the CAMERA.
  const DEF = { park: 'MLB', pitch: 77, yaw: 0, k: 0.04, zoom: 2.5, wallH: CFG.MLB.wallHt, poleH: CFG.MLB.poleHt, panX: 0, panY: 0, fwd: 32, strafe: 0, camZ: -6, mowOut: 1, mowIn: 0.5, bsH: 4, sideH: 6, grassD: 3, grassLip: 0.25, bbX: -3, bbY: -2, bbH: 7.75, fenceDist: true };   // default = the batter's-eye view   // mowIn 0.5 = infield stripes half the outfield width by default   // default = MLB (the level all supplied dims are for); LL dims still need to be researched
  const cam = { ...DEF };
  const PRESETS = {
    'Overhead':  { pitch: 8,  yaw: 0, k: 0.0015, zoom: 1,   panX: 0, panY: 0 },
    'Tilted':    { pitch: 46, yaw: 0, k: 0.003,  zoom: 1.1, panX: 0, panY: 0 },
    'Broadcast': { pitch: 62, yaw: 0, k: 0.006,  zoom: 1.7, panX: 0, panY: -18 },
  };
  const svg = document.getElementById('fld');
  const stage = document.querySelector('.stage');

  // viewBox tracks the stage aspect so the field fills the screen with no letterbox
  function fitViewport() {
    const r = stage.getBoundingClientRect();
    VB.h = Math.max(120, Math.round(100 * r.height / r.width));
    svg.setAttribute('viewBox', `0 0 ${VB.w} ${VB.h}`);
    computeBase();
  }

  const rows = [
    ['pitch', 0, 89, 1, '°', 'tilt back'],
    ['yaw', -180, 180, 1, '°', 'rotate'],
    ['k', 0, 0.04, 0.0005, '', 'perspective'],
    ['zoom', 0.05, 40, 0.01, '×', 'zoom'],
    ['wallH', 0, 60, 0.5, 'ft', 'wall height'],
    ['poleH', 0, 120, 1, 'ft', 'pole height'],
    ['panX', -400, 400, 2, '', 'pan ←→'],
    ['panY', -400, 400, 2, '', 'pan ↑↓'],
    ['fwd', -150, 350, 2, 'ft', 'dolly fwd/bk'],
    ['strafe', -300, 300, 2, 'ft', 'strafe ←→'],
    ['camZ', -150, 150, 1, 'ft', 'cam Z (height)'],
    ['bsH', 4, 30, 0.5, 'ft', 'backstop ht'],
    ['sideH', 0, 30, 0.5, 'ft', 'side-wall ht'],
    ['grassD', 0, 12, 0.5, 'ft', 'grass depth'],
    ['grassLip', 0, 4, 0.25, 'ft', 'grass lift'],
    ['bbH', 0, 14, 0.25, 'ft', 'scale-ref ht (0=off)'],
    ['bbX', -220, 220, 1, 'ft', 'scale-ref X'],
    ['bbY', -30, 420, 1, 'ft', 'scale-ref Y'],
  ];
  const draw = () => {
    STYLE.wall.heightFt = cam.wallH; STYLE.foulPole.heightFt = cam.poleH;
    svg.innerHTML = renderField(cam);
    out.textContent = `pitch ${cam.pitch}°  ·  k ${cam.k}  ·  zoom ${cam.zoom}×\nwallH ${cam.wallH}ft  ·  poleH ${cam.poleH}ft  ·  pan ${cam.panX},${cam.panY}`;
  };

  // build the overlay panel + 🎥 toggle (same pattern as the game)
  const panel = document.createElement('div'); panel.id = 'campanel'; panel.hidden = true;
  const presetBar = '<div class="presets">' + Object.keys(PRESETS).map(n => `<button class="pset" data-n="${n}">${n}</button>`).join('') + '</div>';
  const parkBar = '<div class="presets">' + Object.keys(CFG).map(k => `<button class="park pset" data-park="${k}">${k}</button>`).join('') + '</div>';
  // mow-stripe selectors: independent stripe width for the outfield vs infield grass
  const MOW = [['Wide',1.5],['Med',1],['Narrow',0.5],['Fine',0.25],['None',0]];
  const mowSel = (reg,lbl) => `<label class="mowrow"><span>mow ${lbl}</span><select data-mow="${reg}">` +
    MOW.map(([n,v]) => `<option value="${v}"${v==cam[reg]?' selected':''}>${n}</option>`).join('') + '</select></label>';
  const mowBar = '<div class="mowsel">' + mowSel('mowOut','outfield') + mowSel('mowIn','infield') + '</div>';
  const chkBar = `<label class="chkrow"><input type="checkbox" id="fdist"${cam.fenceDist?' checked':''}> fence distance markers</label>`;
  panel.innerHTML = '<div class="ttl">🎥 Field camera</div>' + parkBar + presetBar + mowBar + chkBar + rows.map(([k,min,max,st,u,l]) =>
    `<label><span>${l}</span><input type="range" data-k="${k}" min="${min}" max="${max}" step="${st}" value="${cam[k]}"><b id="v-${k}">${cam[k]}${u}</b><button class="rst" data-k="${k}" title="reset ${l}">↺</button></label>`
  ).join('') + '<div class="row"><button id="reset">reset all</button></div><pre id="out"></pre>';
  document.body.appendChild(panel);
  const out = panel.querySelector('#out');
  const syncLabel = k => { const r = rows.find(r=>r[0]===k); if (r) panel.querySelector('#v-'+k).textContent = cam[k] + r[4]; };
  const syncSlider = k => { const inp = panel.querySelector(`input[data-k="${k}"]`); if (inp) { inp.value = cam[k]; syncLabel(k); } };
  const applyAll = obj => { Object.assign(cam, obj); rows.forEach(r => syncSlider(r[0])); draw(); };
  panel.querySelectorAll('input[type=range]').forEach(inp => inp.addEventListener('input', () => {
    cam[inp.dataset.k] = parseFloat(inp.value); syncLabel(inp.dataset.k); draw();
  }));
  const syncMow = () => { panel.querySelectorAll('select[data-mow]').forEach(s => s.value = cam[s.dataset.mow]); const fd=panel.querySelector('#fdist'); if(fd) fd.checked = !!cam.fenceDist; };
  panel.querySelectorAll('select[data-mow]').forEach(s => s.addEventListener('change', () => { cam[s.dataset.mow] = parseFloat(s.value); draw(); }));
  panel.querySelector('#fdist').addEventListener('change', e => { cam.fenceDist = e.target.checked; draw(); });
  panel.querySelectorAll('.rst').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; cam[k] = DEF[k]; syncSlider(k); draw(); }));
  panel.querySelectorAll('.pset[data-n]').forEach(b => b.addEventListener('click', () => applyAll({ ...PRESETS[b.dataset.n] })));
  const markPark = () => panel.querySelectorAll('.park').forEach(b => b.style.background = b.dataset.park===cam.park ? '#26c565' : '');
  panel.querySelectorAll('.park').forEach(b => b.addEventListener('click', () => {
    cam.park = b.dataset.park; const P = CFG[cam.park];
    cam.wallH = P.wallHt; cam.poleH = P.poleHt;   // load this park's regulation fence/pole
    syncSlider('wallH'); syncSlider('poleH');
    computeBase(); markPark(); draw();
  }));
  markPark();
  panel.querySelector('#reset').addEventListener('click', () => { Object.assign(cam, DEF); computeBase(); rows.forEach(r => syncSlider(r[0])); syncMow(); markPark(); draw(); });
  const toggle = document.createElement('button'); toggle.id = 'camtoggle'; toggle.textContent = '🎥'; toggle.title = 'Field camera controls';
  toggle.addEventListener('click', () => { panel.hidden = !panel.hidden; });
  document.body.appendChild(toggle);

  // ---- WALL EDITOR: toggle + a small how-to hint ----
  const wetoggle = document.createElement('button'); wetoggle.id = 'wetoggle'; wetoggle.textContent = '✎';
  wetoggle.title = 'Edit foul-territory walls';
  const hint = document.createElement('div'); hint.id = 'wehint'; hint.hidden = true;
  hint.innerHTML = '<b>Wall editor</b><br>• <b>drag</b> a dot to move · <b>click</b> a dot to select<br>• <b>＋</b> on a segment adds a vertex · <b>×</b> deletes the selected one<br>• selected vertex: slider sets its height (runs ramp between)<br>• middle-drag pans · snaps to ends + straight (180° <span style="color:#7dff9b">green</span>)'
    + '<div id="wesegrow" hidden><span>vertex height</span><input type="range" id="weseg" min="0" max="60" step="0.5" value="6"><b id="wesegval">6ft</b></div>'
    + '<label id="wemirrorrow"><input type="checkbox" id="wemirror" checked> mirror L ⇋ R</label>'
    + '<button id="wetopdown">⤓ reset to top-down</button>';
  let editSyncSeg = () => {};   // assigned inside the editor IIFE; hides the height row on toggle
  // TOP-DOWN framing for editing: a near-map view that fits the whole field with all vertices
  // on-screen. Entering edit mode snaps here (camera stays fully movable after); the button
  // re-snaps any time. Exiting restores the view you were on before editing.
  const TOPDOWN = { pitch: 14, yaw: 0, k: 0.0012, zoom: 0.11, fwd: 175, strafe: 0, camZ: 70, panX: 0, panY: -70 };
  const gotoTopDown = () => applyAll({ ...TOPDOWN });
  let preEditCam = null;
  wetoggle.addEventListener('click', () => {
    EDIT.mode = !EDIT.mode; wetoggle.classList.toggle('on', EDIT.mode); hint.hidden = !EDIT.mode;
    EDIT.selV = null; editSyncSeg();                                  // drop any vertex selection
    if (EDIT.mode) { preEditCam = { ...cam }; gotoTopDown(); }        // snap to map on enter
    else { if (preEditCam) applyAll(preEditCam); preEditCam = null; } // restore on exit
  });
  document.body.appendChild(wetoggle); document.body.appendChild(hint);
  hint.querySelector('#wetopdown').addEventListener('click', gotoTopDown);

  // ---- WALL EDITOR: mouse handling (left button; camera uses right button, so no clash) ----
  (function wallEditor() {
    let vdown = null;   // {w, i, sx, sy, dragging} -- a click SELECTS a vertex, a drag MOVES it
    // MIRROR: with mirror on, the two side walls stay symmetric across the y-axis. After any
    // edit to one wall, rebuild the other as its x-negated reflection (keeps counts + heights
    // in sync, so add/delete/height mirror too). The edited wall is the source of truth.
    const OTHER = w => w === 'sideR' ? 'sideL' : 'sideR';
    const isSide = w => w === 'sideR' || w === 'sideL';         // side walls mirror as a PAIR
    const isArc  = w => w === 'outfield' || w === 'backstop';   // single symmetric walls -> WITHIN-wall mirror
    const reflectPt = p => (p.h!=null ? { x:-p.x, y:p.y, h:p.h } : { x:-p.x, y:p.y });
    // MIRROR (when on): sides rebuild the partner from the edited wall; outfield/backstop reflect
    // the just-edited vertex i onto its partner n-1-i (center vertex pinned to the y-axis).
    const mirror = (w, i) => { if (!EDIT.mirror) return;
      if (isSide(w)) { EDIT[OTHER(w)] = EDIT[w].map(reflectPt); return; }
      if (isArc(w) && i != null){ const a=EDIT[w], n=a.length, j=n-1-i;
        if (j===i) a[i] = { ...a[i], x:0 }; else a[j] = reflectPt(a[i]); }
    };
    // re-impose full symmetry (first half -> second) -- used when mirror is switched ON
    const symmetrizeWall = w => { const a=EDIT[w], n=a.length, half=Math.floor(n/2);
      for (let i=0;i<half;i++) a[n-1-i] = reflectPt(a[i]); if (n%2) a[half] = { ...a[half], x:0 }; };
    const svgLoc = e => { const m = svg.getScreenCTM(); if (!m) return null;
      const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(m.inverse()); };
    // move vertex i of wall wk to (wx,wy), applying end-snap then 180-collinear snap, keeping .h
    const moveVertex = (wk, i, wx, wy) => {
      const pts = EDIT[wk], o = pts[i]; let np = { x: wx, y: wy }, snapped = false;
      if (EDIT._snap) for (const t of EDIT._snap){ if (!t || t===o) continue;
        if (Math.hypot(t.x-np.x, t.y-np.y) < 7){ np = { x:t.x, y:t.y }; snapped = true; break; } }
      if (!snapped && i>0 && i<pts.length-1){ const A=pts[i-1], C=pts[i+1];
        const va={x:A.x-np.x,y:A.y-np.y}, vc={x:C.x-np.x,y:C.y-np.y};
        const ang=Math.abs(Math.atan2(va.x*vc.y-va.y*vc.x, va.x*vc.x+va.y*vc.y))*180/Math.PI;
        if (ang>176){ const AC={x:C.x-A.x,y:C.y-A.y}, L2=(AC.x*AC.x+AC.y*AC.y)||1;
          const u=((np.x-A.x)*AC.x+(np.y-A.y)*AC.y)/L2; np = { x:A.x+AC.x*u, y:A.y+AC.y*u }; } }
      // BACKSTOP: can't come closer than the regulation min radius from home plate
      if (wk === 'backstop' && EDIT._backstopMin){ const r = Math.hypot(np.x, np.y);
        if (r > 0.01 && r < EDIT._backstopMin){ const s = EDIT._backstopMin/r; np = { x:np.x*s, y:np.y*s }; } }
      // FOUL POLES (outfield end vertices) ride their foul line: DEPTH only, no lateral drift,
      // so the foul lines stay straight at +/-45deg. Project onto the pole's ray from home.
      if (wk === 'outfield' && (i === 0 || i === pts.length-1)){
        const d = i === 0 ? { x:-SQRT1_2, y:SQRT1_2 } : { x:SQRT1_2, y:SQRT1_2 };   // -45 / +45 foul-line dir
        const depth = Math.max(30, np.x*d.x + np.y*d.y); np = { x: d.x*depth, y: d.y*depth };
      }
      const nx=+np.x.toFixed(1), ny=+np.y.toFixed(1);
      pts[i] = (o.h!=null ? { x:nx, y:ny, h:o.h } : { x:nx, y:ny });
      mirror(wk, i);
    };
    svg.addEventListener('mousedown', e => {
      if (!EDIT.mode || e.button !== 0) return;
      const del = e.target.closest('.we-del');   // × on the selected vertex -> delete it (+ its mirror on arc walls)
      if (del) { e.preventDefault(); e.stopPropagation(); const wk=del.dataset.w, pts=EDIT[wk], i=+del.dataset.i;
        if (EDIT.mirror && isArc(wk)){ const n=pts.length, j=n-1-i;
          if (j===i){ if (n>2) pts.splice(i,1); }
          else if (n>3){ pts.splice(Math.max(i,j),1); pts.splice(Math.min(i,j),1); } }   // arc: remove both, higher first
        else { if (pts.length>2) pts.splice(i,1); mirror(wk); }                            // side/non-mirror: splice + pair-mirror
        EDIT.selV=null; syncVsel(); draw(); return; }
      const vh = e.target.closest('.we-vh');      // press on a dot -> maybe drag, maybe click-select
      if (vh) { e.preventDefault(); e.stopPropagation(); vdown = { w:vh.dataset.w, i:+vh.dataset.i, sx:e.clientX, sy:e.clientY, dragging:false }; return; }
      const add = e.target.closest('.we-add');    // ＋ midpoint -> insert a vertex (+ its mirror on arc walls)
      if (add) { e.preventDefault(); e.stopPropagation();
        const wk = add.dataset.w, seg = +add.dataset.seg, pts = EDIT[wk];
        const fb=(EDIT._hfb&&EDIT._hfb[wk]!=null)?EDIT._hfb[wk]:(cam.sideH??6);
        const mkMid = (a,b) => { const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; if (a.h!=null||b.h!=null) m.h=((a.h??fb)+(b.h??fb))/2; return m; };
        if (EDIT.mirror && isArc(wk)){ const n=pts.length, mseg=n-2-seg, mid=mkMid(pts[seg],pts[seg+1]);
          if (mseg===seg){ mid.x=0; pts.splice(seg+1,0,mid); }                         // middle segment -> single, on axis
          else { const rmid=reflectPt(mid), p1=seg+1, p2=mseg+1;                        // insert both, higher position first
            if (p1>p2){ pts.splice(p1,0,mid); pts.splice(p2,0,rmid); } else { pts.splice(p2,0,rmid); pts.splice(p1,0,mid); } }
        } else { pts.splice(seg+1, 0, mkMid(pts[seg],pts[seg+1])); mirror(wk); }
        draw();
      }
    });
    addEventListener('mousemove', e => {
      if (!vdown || !EDIT._P) return;
      if (!vdown.dragging && Math.hypot(e.clientX-vdown.sx, e.clientY-vdown.sy) > 3) vdown.dragging = true;
      if (!vdown.dragging) return;
      const loc = svgLoc(e); if (!loc) return;
      const wpt = EDIT._P.inv(loc.x, loc.y); if (!(isFinite(wpt.x)&&isFinite(wpt.y))) return;
      moveVertex(vdown.w, vdown.i, wpt.x, wpt.y); draw();
    });
    addEventListener('mouseup', () => {
      if (vdown && !vdown.dragging) { EDIT.selV = { w:vdown.w, i:vdown.i }; syncVsel(); draw(); }   // click = select vertex
      vdown = null;
    });
    // mirror toggle (default ON): flipping it on immediately reflects sideR -> sideL
    EDIT.mirror = true;
    const mchk = hint.querySelector('#wemirror');
    mchk.addEventListener('change', () => { EDIT.mirror = mchk.checked;
      if (EDIT.mirror){ mirror('sideR'); symmetrizeWall('outfield'); symmetrizeWall('backstop'); }   // snap all walls symmetric
      draw(); });
    // VERTEX HEIGHT slider: appears when a vertex is selected; sets EDIT[w][i].h.
    const segEl = hint.querySelector('#weseg'), segRow = hint.querySelector('#wesegrow'), segVal = hint.querySelector('#wesegval');
    const hFallback = wk => (EDIT._hfb && EDIT._hfb[wk] != null) ? EDIT._hfb[wk] : (cam.sideH ?? 6);
    const syncVsel = () => { const s = EDIT.selV;
      if (s && EDIT.mode && EDIT[s.w] && EDIT[s.w][s.i]) { segRow.hidden = false;
        segEl.value = EDIT[s.w][s.i].h ?? hFallback(s.w); segVal.textContent = (+segEl.value)+'ft'; }
      else { segRow.hidden = true; EDIT.selV = null; } };
    segEl.addEventListener('input', () => { const s = EDIT.selV; if (!s) return;
      EDIT[s.w][s.i].h = parseFloat(segEl.value); mirror(s.w, s.i); segVal.textContent = (+segEl.value)+'ft'; draw(); });
    editSyncSeg = syncVsel;   // expose so the ✎ toggle can hide the row on exit
  })();

  // ---- keyboard + mouse camera controls ----
  //  WASD ............... W/S dolly forward/back, A/D strafe left/right
  //  right-drag ......... pitch (up/down) + rotate/yaw (left/right)
  //  ctrl + right-drag .. tilt the scene (cam Z up/down, pan left/right)
  //  wheel .............. zoom     ·     ctrl + wheel .. perspective
  (function controls() {
    const lim = k => { const r = rows.find(x => x[0] === k); return r ? [r[1], r[2]] : [-1e9, 1e9]; };
    const apply = obj => { for (const k in obj) { const nv = cam[k] + obj[k];
      if (k === 'yaw') cam[k] = ((nv + 180) % 360 + 360) % 360 - 180;   // wrap -> continuous rotation, no dead stop at 180
      else { const [lo,hi] = lim(k); cam[k] = Math.max(lo, Math.min(hi, nv)); }
    } for (const k in obj) syncSlider(k); draw(); };
    // WASD via a HELD-KEYS set + animation loop, so multiple keys register at once
    // (W+A = smooth diagonal). Discrete keydown only repeats the LAST key the OS is
    // repeating, so simultaneous keys were impossible before.
    const held = new Set();
    addEventListener('keydown', e => {
      const t = e.target && e.target.tagName; if (t === 'INPUT' || t === 'TEXTAREA') return;
      const k = e.key.toLowerCase();
      if ('wasd'.includes(k)) { held.add(k); e.preventDefault(); }
    });
    addEventListener('keyup', e => held.delete(e.key.toLowerCase()));
    addEventListener('blur', () => held.clear());
    (function move(){
      if (held.size) {
        const step = 1.8, d = {};               // world ft per frame (~60fps)
        if (held.has('w')) d.fwd = (d.fwd||0) + step;
        if (held.has('s')) d.fwd = (d.fwd||0) - step;
        if (held.has('d')) d.strafe = (d.strafe||0) + step;
        if (held.has('a')) d.strafe = (d.strafe||0) - step;
        if (Object.keys(d).length) apply(d);
      }
      requestAnimationFrame(move);
    })();
    let drag = null;
    stage.addEventListener('contextmenu', e => e.preventDefault());
    stage.addEventListener('mousedown', e => {
      if (e.button === 2) { e.preventDefault(); drag = { x: e.clientX, y: e.clientY, ctrl: e.ctrlKey, mode: 'orbit' }; }
      else if (e.button === 1) { e.preventDefault(); drag = { x: e.clientX, y: e.clientY, mode: 'pan' }; }   // middle-drag = pan
    });
    addEventListener('mousemove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.ctrl = e.ctrlKey;
      if (drag.mode === 'pan') apply({ panX: dx * 0.2, panY: dy * 0.2 });      // grab-and-move the view
      else if (drag.ctrl) apply({ camZ: -dy * 0.4, panY: dx * 0.6 });
      else apply({ pitch: -dy * 0.25, yaw: dx * 0.3 });
    });
    addEventListener('mouseup', () => { drag = null; });
    // zoom is MULTIPLICATIVE: step scales with current zoom so every wheel tick is the
    // same % change (a fixed additive step is a huge jump at 0.05x but tiny at 40x).
    stage.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey) apply({ k: -e.deltaY * 0.00002 }); else apply({ zoom: -e.deltaY * 0.0015 * cam.zoom }); }, { passive: false });
  })();

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { fitViewport(); draw(); }, 120); });
  fitViewport();
  draw();
</script>
</body>
</html>
